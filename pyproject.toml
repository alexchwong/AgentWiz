[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "AgentWiz"              # distribution/display name; import name is `agentwiz`
dynamic = ["version"]          # single source: agentwiz/_version.py
description = "Local browser UI for building and testing LLM steps, built on modelSpell"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "modelSpell @ https://github.com/alexchwong/modelSpell/releases/download/v0.2.1/modelspell-0.2.1-py3-none-any.whl#sha256=607fdcac4b38d198cf55c02d7e8132d79604fb1fc30332c0e0e46b0b58acbd1e",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agentwiz = "agentwiz.__main__:main"

[project.urls]
Source = "https://github.com/alexchwong/AgentWiz"

[tool.hatch.metadata]
allow-direct-references = true   # required for the pinned modelSpell wheel URL

[tool.hatch.version]
path = "agentwiz/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agentwiz"]

[tool.hatch.build.targets.sdist]
only-include = ["agentwiz", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"
markers = ["live: opt-in tests against real backends (see tests/test_live.py)"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "AgentWiz"              # distribution/display name; import name is `agentwiz`
dynamic = ["version"]          # single source: agentwiz/_version.py
description = "Local browser UI for building and testing LLM steps, built on modelSpell"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.26,<5",
  "pypdfium2>=5.13,<6",           # PDF reading in the worker process (0.2.2 starter blocks addendum, 4.2-4.3)
  "modelSpell @ https://github.com/alexchwong/modelSpell/releases/download/v0.4.0/modelspell-0.4.0-py3-none-any.whl#sha256=9ae1c5af17666298c519d78ab5b4dd49371cbb40a5c7f028185de8f46dbada88",
  "scriptSpell @ https://github.com/alexchwong/scriptSpell/releases/download/v0.3.0/scriptspell-0.3.0-py3-none-any.whl#sha256=014e311bf84ea711534cc2a1c755b0b679ff31632dc86ece1975afb9f7feaa06",
]

[project.optional-dependencies]
dev = ["pytest", "playwright==1.63.0"]

[project.scripts]
agentwiz = "agentwiz.__main__:main"
agentwiz-webspell = "agentwiz.webspell_service:main"

[project.urls]
Source = "https://github.com/alexchwong/AgentWiz"

[tool.hatch.metadata]
allow-direct-references = true   # required for the pinned modelSpell and scriptSpell wheel URLs

[tool.hatch.version]
path = "agentwiz/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agentwiz"]
exclude = ["/agentwiz/library/deidentify_text"] # excluded from 0.2.4; may be replaced by improved identifier redaction

[tool.hatch.build.targets.wheel.force-include]
"config/model-servers.ini.template" = "agentwiz/model-servers.ini.template"
".env.example" = "agentwiz/.env.example"

[tool.hatch.build.targets.sdist]
only-include = ["agentwiz", "config/model-servers.ini.template", ".env.example", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"
markers = [
  "live: opt-in tests against real backends (see tests/test_live.py)",
]

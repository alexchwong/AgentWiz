name: Tests

on:
  push:
    branches: [devel, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # R0-7; WSL2 is checked manually
        python: ["3.10", "3.13"]            # floor and the version development is tested on
    steps:
      - uses: actions/checkout@v7           # the triggering commit (default)
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install AgentWiz and test dependencies (downloads the pinned modelSpell wheel)
        run: python -m pip install -e '.[dev]'
      - name: Install Chromium for the page checks (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for the page checks (macOS)
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Run the offline suite (the live checks are deselected, whatever variables the runner holds)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -vv -ra -o faulthandler_timeout=120 -m "not live" --junitxml="$RUNNER_TEMP/offline.xml"
          python - "$RUNNER_TEMP/offline.xml" <<'PYTHON'
          import sys
          from xml.etree import ElementTree
          report = ElementTree.parse(sys.argv[1])
          allowed = {("tests.test_pdf", "test_a_runaway_allocation_is_stopped_by_the_address_space_limit")} if sys.platform == "darwin" else set()
          for case in report.iter("testcase"):
              if case.find("skipped") is not None:
                  key = (case.get("classname"), case.get("name"))
                  if key not in allowed:
                      raise SystemExit(f"Unexpected offline skip: {key}")
          PYTHON
      - name: Build the candidate wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/agentwiz-wheels"
      - name: Replace editable installation with the candidate wheel
        run: python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/agentwiz-wheels/agentwiz-*.whl
      - name: Check the installed wheel outside the checkout (version, Workflow Design outcome, required cases)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -I -c 'import re,pathlib; print(re.search(r"^__version__ = \"([0-9]+\.[0-9]+\.[0-9]+)\"$", pathlib.Path("agentwiz/_version.py").read_text(), re.M).group(1))')"
          OUTCOME="$(python -I -c 'import json; print(json.load(open("scripts/installed_gate.json"))["workflow_outcome"])')"
          echo "installed gate: version $VERSION, workflow outcome $OUTCOME"
          python scripts/check_installed_ui.py --expect-version "$VERSION" --workflow-outcome "$OUTCOME"
          for OTHER in f-a f-b removal; do
            [ "$OTHER" = "$OUTCOME" ] && continue
            set +e
            python scripts/check_installed_ui.py --expect-version "$VERSION" --workflow-outcome "$OTHER" --shape-only
            STATUS=$?
            set -e
            [ "$STATUS" -eq 3 ] || { echo "installed gate: outcome $OTHER was not rejected (exit $STATUS)"; exit 1; }
          done

  pdf-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the candidate wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/agentwiz-wheels"
      - name: Install the wheel and require a binary pypdfium2 distribution
        run: python -m pip install --only-binary=pypdfium2 "$RUNNER_TEMP"/agentwiz-wheels/agentwiz-*.whl
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Extract packaged PDF fixtures and check licence notices
        run: python -I scripts/check_pdf_install.py --require-installed

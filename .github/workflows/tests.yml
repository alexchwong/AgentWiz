name: Tests

on:
  push:
    branches: [devel, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # R0-7; WSL2 is checked manually
        python: ["3.10", "3.13"]            # floor and the version development is tested on
    steps:
      - uses: actions/checkout@v7           # the triggering commit (default)
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install AgentWiz and test dependencies (downloads the pinned modelSpell wheel)
        run: python -m pip install -e '.[dev]'
      - name: Install Chromium for the page checks (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for the page checks (macOS)
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Run the offline suite (the live checks are deselected, whatever variables the runner holds)
        run: python -m pytest -m "not live"

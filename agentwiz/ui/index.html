<!doctype html>
<!-- Derived from modelSpell ui/index.html at commit 1759c6e3c28a637731434a73c46088048583e358 (MIT, Copyright (c) 2026 Alex Wong); adapted per the AgentWiz 0.1.0 techspec, Section 7.7, the 0.1.1 techspec, Section 7.8, and the 0.1.3 techspec, Section 11. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentWiz</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --box:#fff; --accent:#2f5bd3; --err:#c0392b; --warn:#9a5b00; --ok:#1e7a3c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161617; --fg:#ececf0; --muted:#9a9aa2; --line:#3a3a3e; --box:#1f1f22; --accent:#7ea2ff; --err:#ff7a6b; --warn:#f0b35a; --ok:#6fcf8f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  header h1 { font-size:16px; margin:0; }
  #summary { color:var(--muted); font-family:ui-monospace, monospace; font-size:12px; flex:1; min-width:200px; }
  textarea, input, select { width:100%; font:inherit; color:inherit; background:var(--box); border:1px solid var(--line); border-radius:6px; padding:8px; }
  textarea { resize:vertical; font-family:ui-monospace, monospace; }
  button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--box); color:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 800px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .checkbox-label { display:flex; align-items:center; gap:8px; }
  .checkbox-label input[type="checkbox"] { width:auto; margin:0; padding:0; flex:none; }
  pre { margin:0; min-height:120px; max-height:50vh; overflow:auto; white-space:pre-wrap; word-break:break-word;
        background:var(--box); border:1px solid var(--line); border-radius:6px; padding:8px; font:13px/1.45 ui-monospace, monospace; }
  pre.reasoning { color:var(--muted); }
  pre.exact { overflow-wrap:anywhere; word-break:break-all; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .status { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  .status.error { color:var(--err); }
  .status.warn { color:var(--warn); }
  .status.normal { color:var(--fg); }
  #version, #workspace { color:var(--muted); font-weight:normal; font-size:12px; }
  #banner { color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:8px; margin-bottom:12px; }
  #banner p { margin:0; }
  #settings-msg.warn { color:var(--warn); }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); width:min(560px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .inline { display:flex; gap:8px; } .inline > :first-child { flex:1; }
  .hidden, [hidden] { display:none !important; }
  details pre { min-height:0; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:10px 0; padding:4px 10px 10px; }
  .fields { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:0 12px; }
  .fields label { margin-top:6px; }
  .note { color:var(--muted); font-size:11px; }
  .invalid { border-color:var(--err); }
  .disabled-field { opacity:.55; }
  .muted { color:var(--muted); }
  .warn-text { color:var(--warn); }
  .err-text { color:var(--err); }
  .preview { border:1px solid var(--line); border-radius:6px; padding:8px; margin:8px 0; }
  .preview pre { min-height:0; max-height:30vh; }
  .preview .meta { color:var(--muted); font-size:12px; margin:4px 0; }
  .switch { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg); margin:0; }
  .switch input { width:auto; margin:0; padding:0; }
  .saving { color:var(--warn); font-size:12px; }
  .tabs { display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tabs button[role="tab"] { border:1px solid var(--line); border-bottom:none; border-radius:6px 6px 0 0; background:var(--bg); color:var(--muted); padding:6px 12px; margin-bottom:-1px; }
  .tabs button[role="tab"][aria-selected="true"] { background:var(--box); color:var(--fg); border-bottom:1px solid var(--box); font-weight:600; }
  .tabs .mark { display:none; color:var(--accent); margin-left:4px; }
  .tabs button[data-state="running"] .mark { display:inline; }
  .panel-intro { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .panelhead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .panelhead label { margin:10px 0 4px; }
  .copy { display:inline-flex; align-items:center; gap:6px; }
  .copy button { padding:2px 10px; font-size:12px; }
  .list { list-style:none; margin:4px 0; padding:0; border:1px solid var(--line); border-radius:6px; }
  .list li { padding:6px 8px; border-bottom:1px solid var(--line); }
  .list li:last-child { border-bottom:none; }
  .list li.pick { cursor:pointer; }
  .list li.pick:hover, .list li.current { background:var(--box); }
  .checkbox { border:1px solid var(--line); border-radius:6px; padding:8px; margin:8px 0; background:var(--box); }
  .checkbox[data-check="pass"] .overall { color:var(--ok); }
  .checkbox[data-check="fail"] .overall, .checkbox[data-check="contract_error"] .overall { color:var(--err); }
  .checkbox[data-check="incomplete"] .overall { color:var(--warn); }
  .checkbox ul { margin:4px 0; padding-left:18px; font-family:ui-monospace, monospace; font-size:12px; }
  .editor { min-height:260px; }
  #tutorial-box { position:sticky; top:0; z-index:5; background:var(--bg); border:2px solid var(--accent, #5688cc); padding:12px; margin:12px 0; }
  #tutorial-box p { margin:6px 0; }
  #tutorial-box input[type="checkbox"] { width:auto; }
  .tutorial-target { outline:3px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<header>
  <h1>AgentWiz <span id="version"></span></h1>
  <span id="workspace"></span>
  <span id="summary"></span>
  <label class="switch" title="Saved as given, except that credentials AgentWiz has held, if at least 8 characters long, are replaced with ***. Shorter credentials are not replaced. Text you paste into a request, including copied documents and tool results, is saved with it.">
    <input type="checkbox" id="save-runs" data-test="header-save-runs"> Save runs</label>
  <span id="saving" class="saving hidden" data-test="header-saving">Saving runs</span>
  <span id="switch-msg" class="note err-text hidden" data-test="header-switch-msg"></span>
  <button id="open-settings" data-test="header-model-settings">Model settings</button>
  <button id="open-servers" data-test="header-mcp-servers">MCP servers</button>
  <button id="open-roles" data-test="header-roles">Roles</button>
  <button id="open-tutorial" data-test="header-tutorial">Tutorial</button>
</header>
<aside id="tutorial-box" class="hidden" data-test="tutorial-box" aria-label="Tutorial guidance">
  <strong id="tutorial-title"></strong>
  <p id="tutorial-tip"></p>
  <p id="tutorial-status" role="status" aria-live="polite" data-test="tutorial-status"></p>
  <div id="tutorial-actions" class="row"></div>
  <div class="row">
    <button id="tutorial-back" data-test="tutorial-back">Back</button>
    <button id="tutorial-reset" data-test="tutorial-reset">Reset step</button>
    <button id="tutorial-skip" data-test="tutorial-skip">Skip</button>
    <button id="tutorial-next" data-test="tutorial-next">Next</button>
    <button id="tutorial-exit" data-test="tutorial-exit">Exit tutorial</button>
  </div>
  <label for="tutorial-jump">Choose a feature</label>
  <select id="tutorial-jump" data-test="tutorial-jump"></select>
</aside>
<div id="header-note" class="note hidden" data-test="header-note"></div>
<div id="banner" class="hidden" data-test="banner"></div>

<div class="tabs" role="tablist" aria-label="AgentWiz functions" id="tablist">
  <button role="tab" id="tab-chat" data-test="tab-chat" aria-controls="panel-chat" aria-selected="false" tabindex="-1" data-state="idle" data-frag="chat">Chat<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-documents" data-test="tab-documents" aria-controls="panel-documents" aria-selected="false" tabindex="-1" data-state="idle" data-frag="documents">Documents<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-mcp-tools" data-test="tab-mcp-tools" aria-controls="panel-mcp-tools" aria-selected="false" tabindex="-1" data-state="idle" data-frag="mcp-tools">MCP tools<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-contracts" data-test="tab-contracts" aria-controls="panel-contracts" aria-selected="false" tabindex="-1" data-state="idle" data-frag="contracts">Contracts<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-checked-request" data-test="tab-checked-request" aria-controls="panel-checked-request" aria-selected="false" tabindex="-1" data-state="idle" data-frag="checked-request">Checked request<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-history" data-test="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1" data-state="idle" data-frag="history">History<span class="mark" aria-hidden="true">●</span></button>
  <button role="tab" id="tab-blocks" data-test="tab-blocks" aria-controls="panel-blocks" aria-selected="false" tabindex="-1" data-state="idle" data-frag="blocks">Blocks<span class="mark" aria-hidden="true">●</span></button>
</div>
<section role="tabpanel" id="panel-chat" data-test="panel-chat" aria-labelledby="tab-chat" hidden></section>
<section role="tabpanel" id="panel-documents" data-test="panel-documents" aria-labelledby="tab-documents" hidden></section>
<section role="tabpanel" id="panel-mcp-tools" data-test="panel-mcp-tools" aria-labelledby="tab-mcp-tools" hidden></section>
<section role="tabpanel" id="panel-contracts" data-test="panel-contracts" aria-labelledby="tab-contracts" hidden></section>
<section role="tabpanel" id="panel-checked-request" data-test="panel-checked-request" aria-labelledby="tab-checked-request" hidden></section>
<section role="tabpanel" id="panel-history" data-test="panel-history" aria-labelledby="tab-history" hidden></section>
<section role="tabpanel" id="panel-blocks" data-test="panel-blocks" aria-labelledby="tab-blocks" data-state="idle" hidden></section>

<dialog id="servers-dialog">
  <h3 style="margin:4px 0">MCP servers</h3>
  <p class="note">Shared by every workspace. Tokens are kept in memory only, or read from the named environment variable.</p>
  <div id="servers-list"></div>
  <p id="servers-msg" class="note"></p>
  <div class="row" style="justify-content:flex-end">
    <button type="button" id="add-server">Add</button>
    <button type="button" id="close-servers">Close</button>
    <button type="button" id="save-servers" class="primary">Save</button>
  </div>
</dialog>

<dialog id="roles-dialog" data-test="roles-dialog" data-state="idle">
  <h3 style="margin:4px 0">Roles</h3>
  <p class="note">A role names a profile. Blocks use roles, so a block can be moved between models by changing this map.</p>
  <p class="note" id="roles-path" data-test="roles-path"></p>
  <div id="roles-list"></div>
  <p id="roles-msg" class="note" data-test="roles-msg"></p>
  <div class="row" style="justify-content:flex-end">
    <button type="button" id="add-role" data-test="roles-add">Add role</button>
    <button type="button" id="close-roles" data-test="roles-close">Close</button>
    <button type="button" id="save-roles" class="primary" data-test="roles-save">Save</button>
  </div>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <label for="profile">Profile</label>
    <div class="inline"><select id="profile"></select><button type="button" id="delete-profile">Delete</button></div>
    <button type="button" id="update-profiles">Update profiles from defaults…</button>
    <label class="checkbox-label"><input type="checkbox" id="export-default"> Export as default when saving</label>
    <label for="kind">Model source</label>
    <select id="kind">
      <option value="lmstudio">LM Studio</option>
      <option value="openrouter">OpenRouter</option>
      <option value="openai_compat">OpenAI-compatible</option>
    </select>
    <label for="base_url">Base URL (including /v1; blank = default)</label>
    <input id="base_url" placeholder="">
    <div id="key-row">
      <label for="api_key">API key (write-only; blank keeps the current key) <span id="key-state"></span></label>
      <div class="inline"><input id="api_key" type="password" autocomplete="off"><button type="button" id="clear-key">Clear</button></div>
    </div>
    <label for="model">Model ID</label>
    <div class="inline"><input id="model" list="model-list"><button type="button" id="load-models">Load models</button></div>
    <datalist id="model-list"></datalist>
    <div id="provider-row">
      <label for="provider">Provider (OpenRouter)</label>
      <div class="inline"><select id="provider"><option value="">Any (OpenRouter routing)</option></select>
        <button type="button" id="load-providers">Load providers</button></div>
    </div>
    <p id="settings-msg" class="hidden"></p>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button type="button" id="save-as-profile">Save as profile…</button>
      <button type="button" id="save-profile">Save profile</button>
      <button type="button" id="apply" class="primary">Apply</button>
    </div>
  </form>
</dialog>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const DEFAULT_URL = { lmstudio: "http://localhost:1234/v1", openrouter: "https://openrouter.ai/api/v1", openai_compat: "required" };
const STALE_SEND = "Settings, a contract or the saving switch were changed elsewhere. The page has reloaded them; check them and send again.";
const STALE_SAVE = "Settings were changed in another tab. The header now shows the current settings; check them and save again.";
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
const LABELS = { complete: "Complete", empty: "Empty answer", reasoning_only: "Reasoning only, no answer",
                 truncated: "Truncated answer", truncated_no_answer: "Truncated before any answer",
                 stopped: "Stopped", error: "Error" };
const DISCLOSURE = "Saved as given, except that credentials AgentWiz has held, if at least 8 characters long, are replaced with ***. " +
  "Shorter credentials are not replaced. Text you paste into a request, including copied documents and tool results, is saved with it.";
const FRAGS = ["chat", "documents", "mcp-tools", "contracts", "checked-request", "history", "blocks"];
const POLL_MS = 2000;
let state = {}, clearKey = false;
const modelContexts = {};       // model id -> context length, from the dialog's last Load models
const BASIC = ["temperature", "max_tokens"];
const ADVANCED = ["top_p", "top_k", "min_p", "repetition_penalty", "presence_penalty", "frequency_penalty", "seed", "stop"];
const INTEGER_FIELDS = ["max_tokens", "top_k", "seed"];
const NUMBER_RE = /^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$/;
const INTEGER_RE = /^-?(0|[1-9][0-9]*)$/;
const SAFE = 9007199254740991n;
const TASK_STALE = "Task settings were saved in another tab; your values are kept, so save again to replace them.";
const TABS = {};                // fragment -> { panel, onShow?, onState?, submit? }

class ApiError extends Error {
  constructor(message, status, code, body) { super(message); this.status = status; this.code = code; this.body = body || {}; }
}

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST",
    headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {};
  try { j = await r.json(); } catch (e) { if (r.ok) throw e; }
  if (!r.ok) throw new ApiError(j.error || r.statusText, r.status, j.code, j);
  return j;
}

// A GET whose body text is kept exactly as received (the polling envelope).
async function apiText(path) {
  const r = await fetch(path, { headers: { "X-Session-Token": TOKEN } });
  const text = await r.text();
  let json = null;
  try { json = JSON.parse(text); } catch (e) { /* reported by the caller */ }
  return { ok: r.ok, status: r.status, text, json };
}

// --- shared helpers (techspec 0.1.3, 11.7) -----------------------------------------------------
// Builds an element. Every string goes in as text; nothing from the server is ever parsed as markup.
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  put(e, ...kids);
  return e;
}

// Appends children: strings as text, arrays flattened, null and false skipped.
function put(parent, ...kids) {
  const add = (kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) kid.forEach(add);
    else parent.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  };
  kids.forEach(add);
  return parent;
}

function selectNode(node) {
  if (!node) return;
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
}

// A Copy button (Section 11.4). `getText` is read at click time; `source` returns the element to select
// if the browser refuses the clipboard.
function copyControl(test, getText, source, label = "Copy") {
  const note = h("span", { class: "note" });
  const button = h("button", { type: "button", "data-test": test, text: label });
  button.onclick = async () => {
    delete button.dataset.copy; note.textContent = "";
    const text = getText();
    try {
      await navigator.clipboard.writeText(text);
      button.dataset.copy = "copied";
    } catch (e) {
      if (source) selectNode(source());
      note.textContent = "Press Ctrl+C (Cmd+C on a Mac) to copy";
      button.dataset.copy = "refused";
    }
  };
  return h("span", { class: "copy" }, button, note);
}

// A labelled <pre> with its Copy button: data-test "<prefix>-<name>" and "<prefix>-copy-<name>".
function outPanel(prefix, name, label, cls = "") {
  const pre = h("pre", { class: cls, "data-test": `${prefix}-${name}` });
  const copy = copyControl(`${prefix}-copy-${name}`, () => pre.textContent, () => pre);
  return { el: h("div", {}, h("div", { class: "panelhead" }, h("label", { text: label }), copy), pre), pre };
}

// Reads NDJSON lines from a response. onEvent(ev, line) may return "stop". Returns "end" (clean end),
// "stopped" (onEvent asked) or "broken" (a bad line, a partial last line or a read error).
async function readLines(resp, onEvent) {
  const reader = resp.body.getReader(), decoder = new TextDecoder();
  const quit = async (why) => { try { await reader.cancel(); } catch (e) { /* closed */ } return why; };
  let buffer = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl); buffer = buffer.slice(nl + 1);
        if (line === "") continue;
        let ev;
        try { ev = JSON.parse(line); } catch (e) { return await quit("broken"); }
        if (ev === null || typeof ev !== "object") return await quit("broken");
        if (onEvent(ev, line) === "stop") return await quit("stopped");
      }
    }
  } catch (e) { return "broken"; }
  return buffer === "" ? "end" : "broken";
}

function seconds(from) { return ((performance.now() - from) / 1000); }

// Token counts: missing → "?"; not a safe integer → "see Result" (the parsed value may be rounded).
function count(n) {
  if (n === null || n === undefined) return "?";
  return Number.isSafeInteger(n) ? String(n) : "see Result";
}

// One line about a committed record (Section 8.2): what happened, in words.
function recordStatus(record, elapsed) {
  const res = record.result, u = (res && res.usage) || {};
  let label = LABELS[record.outcome] || record.outcome;
  const parts = [];
  if (record.outcome === "truncated_no_answer" && res && typeof res.reasoning === "string" && res.reasoning.trim() !== "")
    label += " (token cap reached during reasoning)";
  parts.push(label);
  if (record.outcome === "stopped") {
    if (record.cancel_reason === "page_closed") parts.push("the page was closed or stopped reading");
    if (record.sent === false) parts.push("the request had not been sent");
    else if (record.sent === true) parts.push("the request may have been sent");
  }
  if (record.outcome === "error" && record.error) parts.push(record.error.description);
  if (elapsed !== null) parts.push(`${elapsed.toFixed(1)}s`);
  if (res) {
    parts.push(res.transport, `finish=${res.finish_reason ?? "?"}`,
      `in=${count(u.input_tokens)} out=${count(u.output_tokens)} reasoning=${count(u.reasoning_tokens)}`,
      typeof res.cost === "number" ? `cost=$${res.cost.toFixed(6)}` : "cost=?");
    if (res.provider) parts.push(res.provider);
  }
  if (record.model_lookup && record.model_lookup !== "used") parts.push("LM Studio model lookup: " + record.model_lookup);
  if (record.stop_requested_at && record.stop_mode === null && record.outcome !== "stopped") parts.push("Stop arrived after the answer finished");
  const style = record.outcome === "complete" ? "normal" : (record.outcome === "error" ? "error" : "warn");
  return { text: parts.filter((p) => p !== undefined && p !== null && p !== "").join(" · "), style };
}

// --- check results (Section 7.6, 11.4) ----------------------------------------------------------------
function checkText(check) {
  const lines = [`Overall: ${check.overall}`];
  for (const c of check.checks || [])
    lines.push(`${c.check}${c.type ? " (" + c.type + ")" : ""}: ${c.result}${c.issues ? ` (${c.issues} ${c.issues === 1 ? "issue" : "issues"})` : ""}`);
  for (const i of check.issues || []) lines.push(`${i.location}: ${i.message}`);
  const more = (check.issue_count || 0) - (check.issues || []).length;
  if (more > 0) lines.push(`… and ${more} more ${more === 1 ? "issue" : "issues"} not listed`);
  for (const n of check.notes || []) lines.push(`Note: ${n}`);
  return lines.join("\n");
}

// A check result box with its Copy button; show(check) / clear(reason).
function checkBox(prefix) {
  const body = h("div", { "data-test": `${prefix}-check-body` });
  let text = "";
  const box = h("div", { class: "checkbox hidden", "data-test": `${prefix}-check` },
    h("div", { class: "panelhead" }, h("strong", { text: "Check result" }),
      copyControl(`${prefix}-copy-check`, () => text, () => body)), body);
  return {
    el: box,
    show(check) {
      text = checkText(check);
      box.dataset.check = check.overall; box.classList.remove("hidden");
      body.replaceChildren(h("div", { class: "overall", text: `Overall: ${check.overall}` }));
      const list = h("ul");
      for (const c of check.checks || [])
        list.append(h("li", { text: `${c.check}${c.type ? " (" + c.type + ")" : ""}: ${c.result}${c.issues ? ` (${c.issues} ${c.issues === 1 ? "issue" : "issues"})` : ""}` }));
      body.append(list);
      const issues = h("ul", { "data-test": `${prefix}-issues` });
      for (const i of check.issues || []) issues.append(h("li", { text: `${i.location}: ${i.message}` }));
      const more = (check.issue_count || 0) - (check.issues || []).length;
      if (more > 0) issues.append(h("li", { class: "muted", text: `… and ${more} more ${more === 1 ? "issue" : "issues"} not listed` }));
      body.append(issues);
      for (const n of check.notes || []) body.append(h("div", { class: "note", text: n }));
    },
    note(why) {                    // no check result: say why
      text = why; delete box.dataset.check; box.classList.remove("hidden");
      body.replaceChildren(h("div", { class: "muted", text: why }));
    },
    clear() { text = ""; delete box.dataset.check; box.classList.add("hidden"); body.replaceChildren(); },
  };
}

// --- tabs (Section 11.3) --------------------------------------------------------------------------------
let activeFrag = "chat";

function fragFromHash() {
  let f = "";
  try { f = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* unknown → Chat */ }
  return FRAGS.includes(f) ? f : "chat";
}

function selectTab(frag, opts = {}) {
  activeFrag = frag;
  for (const f of FRAGS) {
    const button = $("tab-" + f), selected = f === frag;
    button.setAttribute("aria-selected", selected ? "true" : "false");
    button.tabIndex = selected ? 0 : -1;
    $("panel-" + f).hidden = !selected;
  }
  if (opts.focus) $("tab-" + frag).focus();
  if (opts.hash !== false && location.hash !== "#" + frag) {
    try { history.replaceState(null, "", "#" + frag); } catch (e) { /* keep the old fragment */ }
  }
  if (TABS[frag] && TABS[frag].onShow) TABS[frag].onShow();
}

function setTabRunning(frag, running) {
  const value = running ? "running" : "idle";
  $("tab-" + frag).dataset.state = value; $("panel-" + frag).dataset.state = value;
}

$("tablist").addEventListener("keydown", (e) => {
  const i = FRAGS.indexOf(activeFrag);
  let next = -1;
  if (e.key === "ArrowRight") next = (i + 1) % FRAGS.length;
  else if (e.key === "ArrowLeft") next = (i + FRAGS.length - 1) % FRAGS.length;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = FRAGS.length - 1;
  if (next < 0) return;
  e.preventDefault();
  selectTab(FRAGS[next], { focus: true });
});
for (const f of FRAGS) $("tab-" + f).addEventListener("click", () => selectTab(f));
window.addEventListener("hashchange", () => { const f = fragFromHash(); if (f !== activeFrag) selectTab(f, { hash: false }); });

// Ctrl/Cmd+Enter acts on the visible tab only.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey)) return;
  const tab = TABS[activeFrag];
  if (tab && tab.submit) { e.preventDefault(); tab.submit(); }
});

// --- header, banner and state ------------------------------------------------------------------------------
function keySource(s) {
  if (s.key_source === "session") return { summary: "key: session", label: "(set for this endpoint)" };
  if (typeof s.key_source === "string" && s.key_source.startsWith("env:")) {
    const name = s.key_source.slice(4);
    return { summary: "key: env " + name, label: `(from ${name})` };
  }
  return { summary: "key: none", label: "(not set)" };
}

function profilesInfo() { return state.profiles || { names: [], active: null, modified: false, read_only: true }; }
function historyInfo() { return state.history || { save_runs: false, revision: 0, read_only: true, short_credential_held: false }; }
function profileLabel(name) {
  return (profilesInfo().conflicts || []).includes(name) ? `${name}-(${state.workspace.name})` : name;
}

function shortCredentialWarning() {
  const hi = historyInfo();
  return hi.save_runs && hi.short_credential_held
    ? "A credential shorter than 8 characters has been held in this session. It cannot be redacted, so saved runs may contain it." : "";
}

function renderState() {
  $("version").textContent = state.agentwiz_version
    ? `v${state.agentwiz_version} · modelSpell v${state.modelspell_version}` : "";
  const ws = state.workspace || {};
  $("workspace").textContent = ws.name ? `workspace: ${ws.name}${ws.read_only ? " (read-only)" : ""}` : "";
  $("workspace").title = ws.path || "";
  const banner = $("banner");
  banner.replaceChildren();
  const problems = Array.isArray(ws.problems) ? ws.problems : [];
  for (const p of problems) banner.append(h("p", { text: `${p.file}: ${p.message}` }));
  if (problems.length)
    banner.append(h("p", { text: "Repair or restore the file. Workspace and profile files need a restart; the MCP server library, shared defaults and contracts are reloaded when repaired." }));
  const pr = profilesInfo();
  $("summary").title = `${pr.path || ""}\nDefaults: ${pr.defaults_path || ""}`;
  if (pr.unresolved_active) banner.append(h("p", { text: `Profile ${pr.unresolved_active} is missing; default settings are in use.` }));
  for (const c of (state.contracts && state.contracts.items) || [])
    if (c.problem) banner.append(h("p", { text: `${c.problem.file}: ${c.problem.message}` }));
  const warning = shortCredentialWarning();
  if (warning) banner.append(h("p", { "data-test": "banner-short-credential", text: warning }));
  banner.classList.toggle("hidden", banner.childElementCount === 0);
  const profile = pr.active === null || pr.active === undefined ? "no profile"
    : `profile: ${profileLabel(pr.active)}${pr.modified ? " (modified)" : ""}`;
  const parts = [profile, state.kind, state.base_url || "(default URL)", state.model || "(no model)"];
  if (state.kind === "openrouter") parts.push("provider=" + (state.provider || "any"));
  parts.push(keySource(state).summary);
  $("summary").textContent = parts.join(" · ");
  const hi = historyInfo();
  $("save-runs").checked = !!hi.save_runs;
  $("save-runs").disabled = !!hi.read_only;
  $("saving").classList.toggle("hidden", !hi.save_runs);
  $("header-note").textContent = hi.save_runs ? DISCLOSURE : "";
  $("header-note").classList.toggle("hidden", !hi.save_runs);
  for (const f of FRAGS) if (TABS[f] && TABS[f].onState) TABS[f].onState();
}

async function refreshState() {
  state = await api("/api/state"); renderState();
}

$("save-runs").onchange = async () => {
  const want = $("save-runs").checked, msg = $("switch-msg");
  msg.classList.add("hidden");
  try {
    state = await api("/api/history/switch", { save_runs: want, revision: historyInfo().revision });
    renderState();
  } catch (e) {
    try { await refreshState(); } catch (e2) { /* keep the last state */ }
    msg.textContent = e.code === "stale_revision" ? "Run saving was changed elsewhere; the switch shows the current setting." : e.message;
    msg.classList.remove("hidden");
  }
};

// A route answered 409 stale_revision: reload the state, keep the tab's inputs, and let the tab show it.
async function reloadAfterStale() {
  try { await refreshState(); } catch (e) { /* the header keeps its last value */ }
}

// --- task settings: one component, one instance per request tab (Section 11.5) ---------------------------
function makeTaskPanel(prefix) {
  const els = {}, boxes = {}, notes = {};
  let filled = false;
  const field = (name, label, ph, tag = "input") => {
    const input = h(tag, { id: `${prefix}-t-${name}`, "data-test": `${prefix}-task-${name}`, placeholder: ph, rows: tag === "textarea" ? 2 : null });
    const note = h("span", { class: "note" });
    els[name] = input; notes[name] = note;
    boxes[name] = h("div", { "data-field": name }, h("label", { for: `${prefix}-t-${name}`, text: label }), input, note);
    return boxes[name];
  };
  els.reasoning = h("select", { id: `${prefix}-t-reasoning`, "data-test": `${prefix}-task-reasoning` },
    h("option", { value: "", text: "Backend default" }), h("option", { value: "off", text: "off" }),
    h("option", { value: "low", text: "low" }), h("option", { value: "medium", text: "medium" }), h("option", { value: "high", text: "high" }));
  const reasoningRow = h("div", {}, h("label", { for: `${prefix}-t-reasoning`, text: "Reasoning" }), els.reasoning);
  const basic = h("div", { class: "fields" }, reasoningRow, field("temperature", "Temperature", "backend default"),
    field("max_tokens", "Max tokens", "backend default"));
  const advancedSummary = h("summary", { text: "Advanced" });
  const advanced = h("details", {}, advancedSummary,
    h("div", { class: "fields" }, field("top_p", "Top-p"), field("top_k", "Top-k"), field("min_p", "Min-p"),
      field("repetition_penalty", "Repetition penalty"), field("presence_penalty", "Presence penalty"),
      field("frequency_penalty", "Frequency penalty"), field("seed", "Seed")),
    field("stop", "Stop sequences (one per line)", "", "textarea"));
  const marker = h("span", { class: "muted", "data-test": `${prefix}-task-marker` });
  const msg = h("span", { class: "note", "data-test": `${prefix}-task-msg` });
  const reset = h("button", { type: "button", text: "Reset", "data-test": `${prefix}-task-reset` });
  const save = h("button", { type: "button", text: "Save task settings", "data-test": `${prefix}-task-save` });
  const el = h("fieldset", {}, h("legend", {}, "Task settings ", marker), basic, advanced, h("div", { class: "row" }, reset, save, msg));

  const supportedNow = () => {
    const sup = state.supported || {};
    const level = state.kind === "openai_compat" ? "" : els.reasoning.value;
    return sup[level] || sup[""] || [];
  };
  const fieldNote = () => {
    if (state.kind === "openai_compat") return "not sent to OpenAI-compatible servers";
    if (state.kind === "lmstudio") return "not sent to LM Studio at this reasoning level";
    return "not sent at this reasoning level";
  };
  // Reads the panel: {values: {name: value}, errors: [names]}. Values include disabled fields.
  const readTask = () => {
    const values = {}, errors = [];
    for (const name of [...BASIC, ...ADVANCED]) {
      const input = els[name];
      input.classList.remove("invalid");
      if (name === "stop") {
        const lines = input.value.split("\n").filter((s) => s !== "");
        if (lines.length) values.stop = lines;
        continue;
      }
      const text = input.value.trim();
      if (text === "") continue;
      const integer = INTEGER_FIELDS.includes(name);
      let ok = integer ? INTEGER_RE.test(text) : NUMBER_RE.test(text);
      if (ok && name === "seed") { const b = BigInt(text); ok = b <= SAFE && b >= -SAFE; }
      if (ok && name === "max_tokens") ok = BigInt(text) >= 1n;
      if (ok && !integer && !Number.isFinite(Number(text))) ok = false;
      if (!ok) { input.classList.add("invalid"); errors.push(name); continue; }
      values[name] = Number(text);
    }
    return { values, errors };
  };
  const taskShape = (values, reasoning) => {
    const out = { reasoning, temperature: values.temperature ?? null, max_tokens: values.max_tokens ?? null, advanced: {} };
    for (const name of ADVANCED) if (values[name] !== undefined) out.advanced[name] = values[name];
    return out;
  };
  const fill = (saved) => {
    saved = saved || {};
    els.reasoning.value = saved.reasoning || "";
    for (const name of BASIC) els[name].value = saved[name] === null || saved[name] === undefined ? "" : String(saved[name]);
    const adv = saved.advanced || {};
    for (const name of ADVANCED) {
      const v = adv[name];
      els[name].value = v === undefined || v === null ? "" : (name === "stop" ? v.join("\n") : String(v));
    }
  };
  const render = () => {
    if (!state.task) return;
    if (!filled) { fill(state.task.saved); filled = true; }     // each panel starts from the saved set
    const enabled = supportedNow();
    reasoningRow.classList.toggle("hidden", state.kind === "openai_compat");
    const { values } = readTask();
    let set = 0, notSent = 0;
    for (const name of [...BASIC, ...ADVANCED]) {
      const on = enabled.includes(name);
      boxes[name].classList.toggle("disabled-field", !on);
      notes[name].textContent = on ? "" : fieldNote();
      if (ADVANCED.includes(name) && values[name] !== undefined) { set++; if (!on) notSent++; }
    }
    advancedSummary.textContent = notSent ? `Advanced (${set} set, ${notSent} not sent)` : `Advanced (${set} set)`;
    const ro = state.task.read_only;
    save.disabled = ro;
    const current = JSON.stringify(taskShape(values, els.reasoning.value));
    const saved = JSON.stringify(taskShape(Object.assign({}, state.task.saved, state.task.saved.advanced || {}), state.task.saved.reasoning || ""));
    marker.textContent = ro ? "(read-only)" : (current !== saved ? "(modified)" : "");
  };
  // What is sent: only enabled, non-blank fields; reasoning omitted for OpenAI-compatible servers.
  const requestTask = () => {
    const { values, errors } = readTask();
    const enabled = supportedNow(), task = {};
    const reasoning = els.reasoning.value;
    if (reasoning && state.kind !== "openai_compat") task.reasoning = reasoning;
    for (const name of BASIC) if (values[name] !== undefined && enabled.includes(name)) task[name] = values[name];
    const adv = {};
    for (const name of ADVANCED) if (values[name] !== undefined && enabled.includes(name)) adv[name] = values[name];
    if (Object.keys(adv).length) task.advanced = adv;
    return { task, errors };
  };
  el.addEventListener("input", render);
  reset.onclick = () => { fill({}); render(); msg.textContent = ""; };
  save.onclick = async () => {
    const { values, errors } = readTask();
    if (errors.length) { msg.textContent = "Correct the marked fields first."; return; }
    try {
      state = await api("/api/task_settings/save", { task: taskShape(values, els.reasoning.value), revision: state.task.revision });
      renderState(); msg.textContent = "Task settings saved.";
    } catch (e) {
      await reloadAfterStale();
      msg.textContent = e.code === "stale_revision" ? TASK_STALE : e.message;
    }
  };
  return { el, render, requestTask };
}

// --- the Model settings dialog (unchanged from 0.1.2) ----------------------------------------------------
function syncDialogVisibility() {
  const kind = $("kind").value;
  $("base_url").placeholder = DEFAULT_URL[kind];
  $("provider-row").classList.toggle("hidden", kind !== "openrouter");
}

function dialogConfig() {
  const kind = $("kind").value;
  const cfg = { kind, base_url: $("base_url").value.trim(), model: $("model").value.trim(),
    provider: kind === "openrouter" ? $("provider").value : "" };
  if ($("api_key").value) cfg.api_key = $("api_key").value; else if (clearKey) cfg.api_key = "";
  return cfg;
}

function settingsMsg(text, warn = false) {
  $("settings-msg").textContent = text; $("settings-msg").classList.toggle("hidden", !text);
  $("settings-msg").classList.toggle("warn", warn);
}

function renderProfileControls() {
  const pr = profilesInfo(), sel = $("profile");
  sel.replaceChildren(new Option("(no profile)", ""));
  for (const name of pr.names) sel.add(new Option(profileLabel(name), name));
  sel.value = pr.active || "";
  sel.disabled = pr.read_only;
  $("delete-profile").disabled = pr.read_only || !pr.active;
  $("save-profile").disabled = pr.read_only || !pr.active;
  $("save-as-profile").disabled = pr.read_only;
  $("update-profiles").disabled = pr.read_only || pr.defaults_read_only;
  $("export-default").disabled = pr.defaults_read_only;
}

function fillDialog() {
  $("export-default").checked = false;
  $("kind").value = state.kind; $("base_url").value = state.base_url || ""; $("model").value = state.model || "";
  $("api_key").value = ""; clearKey = false; $("key-state").textContent = keySource(state).label;
  const p = $("provider"); p.length = 1;
  if (state.provider) p.add(new Option(state.provider, state.provider, true, true));
  renderProfileControls(); syncDialogVisibility();
}

$("open-settings").onclick = () => { fillDialog(); settingsMsg(""); $("settings").showModal(); };
$("kind").onchange = syncDialogVisibility;
$("clear-key").onclick = () => { clearKey = true; $("api_key").value = ""; $("key-state").textContent = "(will be cleared)"; };

$("load-models").onclick = async () => {
  const cfg = dialogConfig(); settingsMsg("Loading models…");
  try {
    const { models } = await api("/api/models", { kind: cfg.kind, base_url: cfg.base_url, api_key: cfg.api_key || null });
    const list = $("model-list"); list.replaceChildren();
    for (const key of Object.keys(modelContexts)) delete modelContexts[key];
    for (const m of models) {
      if (Number.isSafeInteger(m.context_length)) modelContexts[m.id] = m.context_length;
      const tags = [m.loaded ? "loaded" : null, m.reasoning_options ? "reasoning: " + m.reasoning_options.join("/") : null,
                    m.context_length ? m.context_length + " ctx" : null].filter(Boolean).join(", ");
      list.append(new Option(tags ? `${m.name || m.id} (${tags})` : (m.name || m.id), m.id));
    }
    settingsMsg(`${models.length} models loaded; type to filter.`);
  } catch (e) { settingsMsg(e.message); }
};

$("load-providers").onclick = async () => {
  const cfg = dialogConfig(); settingsMsg("Loading providers…");
  try {
    const { providers } = await api("/api/providers", { kind: cfg.kind, base_url: cfg.base_url, api_key: cfg.api_key || null, model: cfg.model });
    const p = $("provider"); p.length = 1;
    for (const x of providers) {
      const label = `${x.name} — ${x.slug ?? "no tag"}${x.quantization ? " · " + x.quantization : ""}${x.context_length ? " · " + x.context_length + " ctx" : ""}`;
      const opt = new Option(label, x.slug ?? ""); opt.disabled = !x.slug; p.add(opt);
    }
    settingsMsg(`${providers.length} endpoints for ${cfg.model}.`);
  } catch (e) { settingsMsg(e.message); }
};

// Shared handling of a failed settings or profile request made from the dialog.
async function dialogFailure(e) {
  if (e.status === 409 && e.code === "stale_revision") {
    try { await refreshState(); renderProfileControls(); settingsMsg(STALE_SAVE, true); }
    catch (e2) { settingsMsg(e2.message); }
  } else if (e.status === 409 || e.status === 404) {   // read_only, no_such_profile
    try { await refreshState(); renderProfileControls(); } catch (e2) { /* keep the last state */ }
    settingsMsg(e.message, true);
  } else settingsMsg(e.message);
}

$("apply").onclick = async () => {
  try {
    state = await api("/api/config", { ...dialogConfig(), revision: state.revision });
    renderState(); $("settings").close();
  } catch (e) { await dialogFailure(e); }
};

// Selecting a profile applies it at once; the dialog is refilled, discarding unapplied edits.
$("profile").onchange = async () => {
  const name = $("profile").value || null;
  try {
    state = await api("/api/profiles/select", { name, revision: state.revision });
    renderState(); fillDialog(); settingsMsg(name ? `Profile ${name} selected.` : "No profile selected.");
  } catch (e) { await dialogFailure(e); }
};

$("delete-profile").onclick = async () => {
  const name = profilesInfo().active;
  if (!name || !confirm(`Delete profile "${name}"? The current settings stay as they are.`)) return;
  try {
    state = await api("/api/profiles/delete", { name, revision: state.revision });
    renderState(); renderProfileControls(); settingsMsg(`Profile ${name} deleted.`);
  } catch (e) { await dialogFailure(e); }
};

async function saveProfile(name) {
  const body = { ...dialogConfig(), name, revision: state.revision,
    export_default: $("export-default").checked };
  try {
    try { state = await api("/api/profiles/save", body); }
    catch (e) {
      if (e.code !== "default_conflict") throw e;
      if (!confirm(`Replace default profile "${name}"?`)) return;
      state = await api("/api/profiles/save", { ...body, overwrite_default: true });
    }
    renderState(); $("settings").close();
  } catch (e) { await dialogFailure(e); }
}

$("update-profiles").onclick = async () => {
  try {
    await refreshState(); renderProfileControls();
    const revision = state.revision, overwrite = [];
    for (const name of profilesInfo().conflicts || []) {
      if (confirm(`Overwrite workspace profile "${name}" with its default? Cancel keeps the workspace copy.`)) overwrite.push(name);
    }
    state = await api("/api/profiles/update", { revision, overwrite });
    renderState(); fillDialog(); settingsMsg("Profiles updated from defaults.");
  } catch (e) { await dialogFailure(e); }
};

$("save-profile").onclick = () => { const name = profilesInfo().active; if (name) saveProfile(name); };

$("save-as-profile").onclick = () => {
  const name = prompt("Profile name (letters, digits, '.', '_' or '-'; up to 64 characters):", tutorialInfo ? "tutorial-example" : "");
  if (name === null) return;
  if (!NAME_RE.test(name)) {
    settingsMsg("A profile name is 1 to 64 letters, digits, '.', '_' or '-', starting with a letter or digit.");
    return;
  }
  if (profilesInfo().names.includes(name) && !confirm(`Profile "${name}" exists. Overwrite it?`)) return;
  saveProfile(name);
};

// --- the request tabs: Chat and Checked request (Sections 5.2, 8.6–8.8, 9, 11.2) ------------------------------
// One controller per tab, built from the same code. Every asynchronous update is correlated by attempt ID, so a
// `save` event, a polling answer or a pending Stop for an earlier attempt never changes a newer request's display.
const REPAIR_REASONS = {
  none: "Send a request first.",
  running: "A request is running.",
  run_stopped: "This run was stopped; send the request again.",
  not_repairable: "A repair is offered only for a completed answer that failed its checks.",
  not_held: "This attempt is no longer held in memory; send the request again.",
  not_latest: "Only the latest attempt of a run can be repaired.",
};
const SKIPPED = { blank_answer: "Not checked: the answer was blank.", not_completed: "Not checked: the request did not complete." };

function repairPreviewText(plan) {
  const s = plan.settings, lines = [
    `Repair of ${plan.parent_id} (next attempt: ${plan.attempt})`,
    `Settings: ${s.kind} · ${s.base_url || "(default URL)"} · model ${s.model || "(none)"}${s.provider ? " · provider " + s.provider : ""}`,
    `Task settings: ${JSON.stringify(s.task)}`,
    `Contract: ${plan.contract.name} (revision ${plan.contract.revision})`,
    "", "Messages:"];
  for (const m of plan.messages) lines.push("", `[${m.role}]`, m.content);
  return lines.join("\n");
}

function makeRequestTab(frag, source) {
  const prefix = frag === "chat" ? "chat" : "checked", checked = source === "checked_request";
  const panel = $("panel-" + frag);
  const task = makeTaskPanel(prefix);
  const system = h("textarea", { id: prefix + "-system", rows: 2, "data-test": prefix + "-system" });
  const prompt = h("textarea", { id: prefix + "-prompt", rows: 6, placeholder: "Ctrl+Enter to send", "data-test": prefix + "-prompt" });
  const send = h("button", { class: "primary", "data-test": prefix + "-send", text: "Send" });
  const stop = h("button", { disabled: true, "data-test": prefix + "-stop", text: "Stop" });
  const statusEl = h("span", { class: "status", "data-test": prefix + "-status", "data-state": "idle" });
  const attemptEl = h("span", { class: "status", "data-test": prefix + "-attempt-id" });
  const reasoning = outPanel(prefix, "reasoning", "Reasoning stream", "reasoning");
  const output = outPanel(prefix, "output", "Output");
  const final = outPanel(prefix, "final", "Final event (exact JSON as received)", "exact");
  const checkResult = checkBox(prefix);
  let active = null, shown = null, rows = [], override = null;

  // checked only
  const contractSel = h("select", { id: "checked-contract", "data-test": "checked-contract" });
  const sendReason = h("span", { class: "note", "data-test": "checked-send-reason" });
  const attemptsEl = h("ul", { class: "list", "data-test": "checked-attempts" });
  const repairReason = h("span", { class: "note", "data-test": "checked-repair-reason" });
  const previewBtn = h("button", { type: "button", "data-test": "checked-repair-preview-btn", text: "Preview repair" });
  const repairSend = h("button", { type: "button", "data-test": "checked-repair-send", text: "Send repair" });
  const repairBox = h("div", { class: "row", "data-test": "checked-repair", "data-repair": "none" }, previewBtn, repairSend, repairReason);
  const previewOut = outPanel("checked", "repair-preview", "Repair preview (exactly what a repair would send)");
  previewOut.el.classList.add("hidden");

  const intro = checked
    ? "Checked request: send a prompt, check the answer against a saved contract, then preview and send a repair."
    : "Chat: send a prompt to the model and watch the answer stream. Stop ends a request at any stage.";
  put(panel, h("p", { class: "panel-intro", text: intro }),
    checked ? [h("label", { for: "checked-contract", text: "Contract" }), contractSel] : null,
    h("label", { for: prefix + "-system", text: "System prompt (optional)" }), system,
    h("label", { for: prefix + "-prompt", text: "Input" }), prompt, task.el,
    h("div", { class: "row" }, send, stop, statusEl, attemptEl, sendReason),
    h("div", { class: "grid" }, reasoning.el, output.el),
    checked ? [checkResult.el, h("label", { text: "Attempts of this run" }), attemptsEl, repairBox, previewOut.el] : null,
    final.el);

  const mark = (name, value) => { if (value === null || value === undefined) delete statusEl.dataset[name]; else statusEl.dataset[name] = value; };
  const display = (state_, text, style = "") => { statusEl.dataset.state = state_; statusEl.textContent = text; statusEl.className = "status " + style; };
  const displays = (req) => req === active || (req.attemptId !== null && req.attemptId === shown);

  function selectedContract() {
    const items = (state.contracts && state.contracts.items) || [];
    return items.find((c) => c.name === contractSel.value && !c.problem) || null;
  }

  function repairCode() {
    if (override) return override;
    if (active) return "running";
    const last = rows[rows.length - 1];
    if (!last) return "none";
    const rec = last.record;
    if (!rec) return "not_held";
    if (rec.stop_requested_at) return "run_stopped";
    if (!(rec.outcome === "complete" || rec.outcome === "truncated") || !rec.check || rec.check.overall !== "fail") return "not_repairable";
    return "allowed";
  }

  function refreshControls() {
    const busy = !!active;
    const noContract = checked && !selectedContract();
    send.disabled = busy || noContract;
    stop.disabled = !(active && !active.final);
    if (checked) {
      sendReason.textContent = noContract && !busy ? "Choose a usable contract first." : "";
      const code = repairCode();
      repairBox.dataset.repair = code;
      previewBtn.disabled = repairSend.disabled = code !== "allowed";
      repairReason.textContent = code === "allowed" ? "" : (REPAIR_REASONS[code] || code);
    }
  }

  function renderRows() {
    attemptsEl.replaceChildren();
    for (const r of rows) {
      const li = h("li", { "data-test": "checked-attempt", "data-attempt-id": r.id,
        text: `${r.attempt}. ${r.outcome ? (LABELS[r.outcome] || r.outcome) : "running"} · check: ${r.check || "not checked"}${r.save && r.save !== "not_requested" ? " · save: " + r.save : ""}` });
      li.dataset.repairReason = (r.record && r.record.repair_reason) || "";
      if (r.outcome) li.dataset.outcome = r.outcome;
      if (r.check) li.dataset.check = r.check;
      if (r.save) li.dataset.save = r.save;
      attemptsEl.append(li);
    }
  }

  function upsertRow(id, patch) {
    if (!checked) return;
    let row = rows.find((r) => r.id === id);
    if (!row) { row = { id, attempt: Number(id.slice(id.lastIndexOf("-") + 1)) }; rows.push(row); }
    Object.assign(row, patch);
    renderRows();
  }

  function clearDisplay() {
    reasoning.pre.textContent = ""; output.pre.textContent = ""; final.pre.textContent = "";
    checkResult.clear();
    for (const name of ["outcome", "attemptId", "save", "error"]) delete statusEl.dataset[name];
    attemptEl.textContent = "";
    if (checked) { previewOut.el.classList.add("hidden"); previewOut.pre.textContent = ""; }
  }

  function release(req) {
    if (active !== req) return;
    active = null;
    setTabRunning(frag, false);
    refreshControls();
  }

  function showSave(req, status, reason) {
    if (!displays(req)) return;
    mark("save", status);
    if (status === "failed") statusEl.textContent = `${statusEl.textContent} · Run not saved: ${reason || "unknown reason"}`;
  }

  function showRecord(req, record, line, saveStatus, elapsed) {
    const s = recordStatus(record, elapsed);
    display("done", s.text, s.style);
    mark("outcome", record.outcome); mark("attemptId", record.id); mark("save", saveStatus);
    attemptEl.textContent = record.id;
    final.pre.textContent = line;
    if (output.pre.textContent === "") output.pre.textContent = (record.result && record.result.text) || (record.partial && record.partial.text) || "";
    if (reasoning.pre.textContent === "") reasoning.pre.textContent = (record.result && record.result.reasoning) || (record.partial && record.partial.reasoning) || "";
    if (checked) {
      if (record.check) checkResult.show(record.check);
      else checkResult.note(SKIPPED[record.check_skipped] || "Not checked.");
    }
  }

  function onFinal(req, ev, line) {
    const record = ev.record;
    if (!record || typeof record !== "object" || req.final) return;
    req.final = ev;
    if (req.attemptId === null) req.attemptId = record.id;
    upsertRow(record.id, { outcome: record.outcome, check: record.check ? record.check.overall : null,
                           save: ev.save_status, record });
    if (displays(req)) showRecord(req, record, line, ev.save_status, req.live ? seconds(req.started) : null);
    if (ev.save_status !== "pending") req.saveSettled = true;
    override = null;
    release(req);
    refreshControls();
  }

  function onSave(req, ev) {
    if (ev.attempt_id !== req.attemptId) return;
    req.saveSettled = true;
    upsertRow(req.attemptId, { save: ev.save_status });
    showSave(req, ev.save_status, ev.reason);
  }

  function unknown(req, text) {
    if (displays(req)) display("unknown", text, "error");
    release(req);
  }

  function refused(req, status, j) {
    req.pendingStop = false;                      // nothing was created, so there is nothing to stop
    const code = j.code || null;
    let text = j.error || `${status}`;
    if (status === 409 && code === "stale_revision") { text = STALE_SEND; display("stale", text, "warn"); reloadAfterStale(); }
    else display("idle", text, status === 503 || status === 409 ? "warn" : "error");
    if (code) mark("error", code);
    if (checked && req.isRepair && ["run_stopped", "not_latest", "not_repairable", "not_held"].includes(code)) override = code;
    release(req);
    refreshControls();
  }

  async function sendStop(req) {
    req.pendingStop = false;
    try {
      const r = await api("/api/complete/stop", { attempt_id: req.attemptId });
      if (r.status === "already_finished" && !req.final && displays(req))
        display("stopping", "Stop arrived after the request finished; waiting for its outcome…", "warn");
    } catch (e) {
      if (!req.final && displays(req)) display("running", "Stop failed: " + e.message, "error");
    }
  }

  function doStop() {
    const req = active;
    if (!req || req.final) return;
    req.stopRequested = true;
    display("stopping", "Stopping…", "warn");
    if (req.attemptId === null) { req.pendingStop = true; return; }     // sent when `started` arrives
    sendStop(req);
  }

  function onEvent(req, ev, line) {
    if (ev.type === "started" && typeof ev.attempt_id === "string") {
      req.attemptId = ev.attempt_id; req.live = true; shown = ev.attempt_id;
      mark("attemptId", ev.attempt_id); attemptEl.textContent = ev.attempt_id;
      upsertRow(ev.attempt_id, { outcome: null, check: null, save: null, record: null });
      if (!req.stopRequested) display("running", "waiting for first token…");
      if (req.pendingStop) sendStop(req);
    } else if ((ev.type === "reasoning" || ev.type === "text") && typeof ev.text === "string") {
      if (!displays(req)) return;
      (ev.type === "text" ? output : reasoning).pre.textContent += ev.text;
      if (!req.stopRequested && statusEl.dataset.state === "running") display("running", "streaming…");
    } else if (ev.type === "final") onFinal(req, ev, line);
    else if (ev.type === "save") onSave(req, ev);
    // unknown event types are ignored
  }

  function applyEnvelope(req, env, text) {
    if (!req.final) {
      if (env.record_held && env.record) {
        onFinal(req, { type: "final", attempt_id: req.attemptId, outcome: env.record.outcome, record: env.record,
                       save_status: env.save_status }, text);
      } else if (env.summary) {
        req.final = { summary: env.summary };
        upsertRow(req.attemptId, { outcome: env.summary.outcome, check: env.summary.check || null, save: env.save_status, record: null });
        if (displays(req)) {
          display("done", `${LABELS[env.summary.outcome] || env.summary.outcome} · Full result no longer held`, "warn");
          mark("outcome", env.summary.outcome); mark("save", env.save_status);
          final.pre.textContent = text;
        }
        release(req);
      }
    }
    if (env.save_status && env.save_status !== "pending") {
      req.saveSettled = true;
      upsertRow(req.attemptId, { save: env.save_status });
      showSave(req, env.save_status, env.reason);
    } else if (env.save_status === "pending" && displays(req)) mark("save", "pending");
    refreshControls();
  }

  // After a lost stream, or a stream that ended with the save still pending: ask the server, every 2 seconds.
  function startPolling(req) {
    if (req.polling || req.attemptId === null) return;
    req.polling = true;
    let failures = 0;
    if (!req.final && displays(req)) display("polling", "Connection lost; asking AgentWiz for the outcome…", "warn");
    const stopPolling = () => { req.polling = false; };
    const tick = async () => {
      if (!req.polling) return;
      let res;
      try { res = await apiText(`/api/attempts/${req.attemptId}`); }
      catch (e) {
        if (++failures >= 15) {
          stopPolling();
          if (!req.final && displays(req)) display("unknown", "Outcome unknown: AgentWiz could not be reached.", "error");
        } else setTimeout(tick, POLL_MS);
        return;
      }
      failures = 0;
      if (res.status === 410) {
        stopPolling();
        if (!req.final && displays(req)) display("unknown", "This attempt's outcome is no longer held.", "error");
        return;
      }
      if (!res.ok || !res.json) {
        stopPolling();
        if (displays(req)) display("unknown", (res.json && res.json.error) || `${res.status}`, "error");
        return;
      }
      const env = res.json;
      if (env.state === "committed") applyEnvelope(req, env, res.text);
      if (env.state === "running" || (env.state === "committed" && env.save_status === "pending")) setTimeout(tick, POLL_MS);
      else stopPolling();
    };
    tick();
  }

  function streamEnded(req) {
    if (req.final) {
      if (req.final.save_status === "pending" && !req.saveSettled) startPolling(req);
      return;
    }
    if (req.attemptId === null) {
      unknown(req, "Outcome unknown: AgentWiz may have accepted this request." +
        (historyInfo().save_runs ? " Open the History tab to see whether it was saved." : ""));
      return;
    }
    release(req);                   // the tab is free again; polling carries on for this attempt
    startPolling(req);
  }

  async function begin(path, payloadText, isRepair) {
    if (active) return;                              // one active request per tab
    const req = { attemptId: null, pendingStop: false, stopRequested: false, final: null, polling: false,
                  saveSettled: false, started: performance.now(), isRepair, live: false };
    active = req; shown = null; override = null;
    clearDisplay();
    if (!isRepair) { rows = []; renderRows(); }
    setTabRunning(frag, true);
    display("running", "waiting for first token…");
    refreshControls();
    let resp;
    try {
      resp = await fetch(path, { method: "POST",
        headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" }, body: payloadText });
    } catch (e) {
      unknown(req, "Outcome unknown: AgentWiz may have accepted this request." +
        (historyInfo().save_runs ? " Open the History tab to see whether it was saved." : ""));
      return;
    }
    if (!resp.ok) {
      let j = {};
      try { j = await resp.json(); } catch (e) { /* keep the status */ }
      refused(req, resp.status, j);
      return;
    }
    await readLines(resp, (ev, line) => onEvent(req, ev, line));
    streamEnded(req);
  }

  function submit() {
    if (active) return;
    const t = task.requestTask();
    if (t.errors.length) { display("idle", "Correct the marked task settings before sending.", "error"); return; }
    const body = { source, prompt: prompt.value, system: system.value, revision: state.revision, task: t.task };
    if (checked) {
      const c = selectedContract();
      if (!c) { display("idle", "Choose a usable contract first.", "error"); return; }
      body.contract = { name: c.name, revision: c.revision };
    }
    const payload = JSON.stringify(body);
    if (state.limits && new TextEncoder().encode(payload).length > state.limits.request_bytes) {
      display("idle", `This request is larger than ${state.limits.request_bytes} bytes and cannot be sent. Copy a smaller part of the file.`, "error");
      return;
    }
    begin("/api/complete", payload, false);
  }

  send.onclick = submit;
  stop.onclick = doStop;

  if (checked) {
    contractSel.onchange = refreshControls;
    previewBtn.onclick = async () => {
      const last = rows[rows.length - 1];
      if (!last) return;
      try {
        const plan = await api("/api/repair/preview", { attempt_id: last.id });
        previewOut.pre.textContent = repairPreviewText(plan);
        previewOut.el.classList.remove("hidden");
      } catch (e) {
        previewOut.el.classList.add("hidden");
        if (["run_stopped", "not_latest", "not_repairable", "not_held"].includes(e.code)) override = e.code;
        refreshControls();
        if (!REPAIR_REASONS[e.code]) repairReason.textContent = e.message;
      }
    };
    repairSend.onclick = () => {
      const last = rows[rows.length - 1];
      if (!last || active) return;
      begin("/api/repair", JSON.stringify({ attempt_id: last.id }), true);
    };
  }

  TABS[frag] = {
    tutorialPrepare(text, preserveTask = false) {
      if (active) throw new Error("Stop the running request first.");
      rows = []; clearDisplay();
      display("idle", "", "");
      prompt.value = text; system.value = "";
      if (!preserveTask) panel.querySelector(`[data-test="${prefix}-task-reset"]`).click();
      if (checked) contractSel.value = "fields";
      refreshControls();
    },
    submit,
    onState() {
      task.render();
      if (checked) {
        const keep = contractSel.value, items = ((state.contracts && state.contracts.items) || []).filter((c) => !c.problem);
        contractSel.replaceChildren();
        if (!items.length) contractSel.add(new Option("(no usable contracts)", ""));
        for (const c of items) contractSel.add(new Option(`${c.name} (${c.format})`, c.name));
        if (items.some((c) => c.name === keep)) contractSel.value = keep;
      }
      refreshControls();
    },
  };
  refreshControls();
}

// --- previews shared by Documents and MCP tools: Copy replaces Insert (Section 11.4) ------------------------------
function sizeLine(ins) {
  const ctx = modelContexts[state.model];
  const tokens = `~${ins.estimated_tokens} tokens (estimate)` + (ctx ? ` of ${ctx} context` : "; context length unknown");
  return `${ins.chars} characters · ${tokens} · ${ins.request_bytes} request bytes`;
}

// A preview of text the user can copy: the provenance line, a newline, then the content (insertion.preview).
// Copy puts exactly `insertion.text` on the clipboard, so a pasted result still says where it came from.
function previewPanel(prefix, copyLabel = "Copy") {
  const title = h("div"), notes = h("div", { class: "meta" }), meta = h("div", { class: "meta" });
  const pre = h("pre", { "data-test": prefix + "-text" });
  let current = null;
  const discard = h("button", { type: "button", "data-test": prefix + "-discard", text: "Discard" });
  const el = h("div", { class: "preview hidden", "data-test": prefix, "data-state": "idle" },
    title, notes, meta, pre,
    h("div", { class: "row" }, copyControl(prefix + "-copy", () => (current ? current.text : ""), () => pre, copyLabel), discard));
  const api_ = {
    el, discard,
    show(opts) {
      current = opts.insertion;
      title.textContent = opts.title || "";
      meta.textContent = sizeLine(current);
      pre.textContent = current.text;
      notes.replaceChildren();
      if (current.too_large_to_send) notes.append(h("div", { class: "warn-text", text: "This text cannot be sent as it is: it is larger than a request may be." }));
      for (const n of opts.notes || []) notes.append(h("div", { text: n }));
      discard.classList.toggle("hidden", !opts.discardable);
      el.classList.remove("hidden"); el.dataset.state = "ready";
    },
    hide() { current = null; el.classList.add("hidden"); el.dataset.state = "idle"; pre.textContent = ""; },
  };
  discard.onclick = () => api_.hide();
  return api_;
}

(function documentsTab() {
  const panel = $("panel-documents");
  const file = h("input", { type: "file", class: "hidden", "data-test": "documents-file" });
  const attach = h("button", { type: "button", "data-test": "documents-attach", text: "Attach file…" });
  const status = h("span", { class: "status", "data-test": "documents-status", "data-state": "idle" });
  const preview = previewPanel("documents-preview");
  panel.append(h("p", { class: "panel-intro", text: "Documents: read a file into text with its provenance line, then copy it into any request." }),
    h("div", { class: "row" }, attach, file, status), preview.el);

  const say = (state_, text, style = "") => {
    status.dataset.state = state_; status.textContent = text; status.className = "status " + style;
    preview.el.dataset.state = state_ === "loading" || state_ === "error" ? state_ : preview.el.dataset.state;
  };

  attach.onclick = () => { file.value = ""; file.click(); };
  async function readFile(f) {
    if (!f) return;
    const limit = state.limits ? state.limits.upload_bytes : 52428800;
    if (f.size > limit) { preview.hide(); say("error", `${f.name} is ${f.size} bytes; files over ${limit} bytes cannot be attached.`, "error"); return; }
    preview.hide();
    setTabRunning("documents", true);
    say("loading", `Reading ${f.name}…`);
    try {
      const r = await fetch("/api/attachments/extract", { method: "POST",
        headers: { "X-Session-Token": TOKEN, "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(f.name) },
        body: f });
      let j = {};
      try { j = await r.json(); } catch (e) { /* keep the status */ }
      if (!r.ok) { say("error", j.error || `${r.status} ${r.statusText}`, "error"); return; }
      const notes = (j.warnings || []).map((w) => "Reader warning: " + w.message);
      if (j.notice) notes.push(j.notice);
      preview.show({ title: `File ${j.filename} (${j.format}, ${j.source_bytes} bytes)`, insertion: j.insertion, notes, discardable: true });
      say("ready", "");
    } catch (e) { say("error", "Upload failed: " + (e.message || e.name), "error"); }
    finally { setTabRunning("documents", false); }
  }
  file.onchange = () => readFile(file.files[0]);
  preview.discard.addEventListener("click", () => say("idle", ""));
  TABS.documents = {
    tutorialExample() {
      return readFile(new File(["# Tutorial document\n\nHello from AgentWiz.\n"], "tutorial.md"));
    },
  };
})();

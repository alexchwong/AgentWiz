      toolsData = await api("/api/mcp/tools", { server, revision: mcpInfo().revision });
      const si = toolsData.server_info ? ` · server says it is ${toolsData.server_info.name || "?"} ${toolsData.server_info.version || ""} (self-reported)` : "";
      info.textContent = `MCP ${toolsData.era} (${toolsData.protocol_version || "?"})${si}`;
      notOffered.replaceChildren();
      if (toolsData.not_offered.length) {
        notOffered.append(h("div", { text: "Tools not offered:" }));
        for (const n of toolsData.not_offered) notOffered.append(h("div", { class: "warn-text", text: `${n.name}: ${n.reason}` }));
      }
      toolSel.replaceChildren();
      for (const tool of toolsData.tools) toolSel.add(new Option(tool.title ? `${tool.title} (${tool.name})` : tool.name, tool.name));
      say("idle", `${toolsData.tools.length} tools.`);
      renderToolForm();
      await refreshState();
    } catch (e) {
      if (e.code === "stale_revision") { await reloadAfterStale(); say("stale", SERVER_STALE); }
      else say("idle", e.message);
    } finally { setTabRunning("mcp-tools", !!toolCtl); }
  };

  function fieldInputFor(f) {
    let input;
    if (f.enum || f.type === "boolean") {
      input = document.createElement("select");
      if (!f.required || f.type === "boolean" && !f.required) input.add(new Option("(unset)", ""));
      const values = f.enum || ["true", "false"];
      for (const v of values) input.add(new Option(v, v));
      if (f.default !== null && f.default !== undefined) input.value = String(f.default);
      else input.value = f.required ? values[0] : "";
    } else {
      input = document.createElement("input");
      if (f.default !== null && f.default !== undefined) input.value = String(f.default);
    }
    input.dataset.name = f.name;
    input.setAttribute("data-test", "mcp-field-" + f.name);
    return input;
  }

  function renderToolForm() {
    const tool = selectedTool();
    formBox.replaceChildren(); notes.replaceChildren(); resultBox.replaceChildren();
    textPreview.hide(); structuredPreview.hide();
    desc.textContent = tool && tool.description ? tool.description : "";
    schemaPre.textContent = tool ? tool.input_schema_text : "";
    for (const n of (tool && tool.form_notes) || []) notes.append(h("div", { text: n }));
    rawMode = !tool || !tool.form;
    if (tool && tool.form) {
      for (const f of tool.form.fields) {
        const wrap = h("div", {}, h("label", { text: (f.title || f.name) + (f.required ? " *" : "") +
          (tool.header_params.includes(f.name) ? " (sent as a header)" : "") }), fieldInputFor(f));
        if (f.description) wrap.append(h("span", { class: "note", text: f.description }));
        formBox.append(wrap);
      }
    }
    argsText.value = rawMode ? "{}" : (formArgs().text || "{}");
    argsText.classList.toggle("hidden", !rawMode);
    formBox.classList.toggle("hidden", rawMode);
    editJson.disabled = rawMode;
  }

  // Builds the arguments' JSON text from the form, keeping numbers exactly as typed.
  function formArgs() {
    const tool = selectedTool(), parts = [], errors = [];
    for (const f of tool.form.fields) {
      const input = formBox.querySelector(`[data-name="${CSS.escape(f.name)}"]`);
      input.classList.remove("invalid");
      const v = input.value;
      if (v === "" || (f.type !== "string" && v.trim() === "")) {
        if (f.required) { input.classList.add("invalid"); errors.push(f.name); }
        continue;
      }
      let text;
      if (f.type === "string") text = JSON.stringify(v);
      else if (f.type === "boolean") text = v === "true" ? "true" : "false";
      else {
        const s = v.trim();
        if (!(f.type === "integer" ? INTEGER_RE : NUMBER_RE).test(s)) { input.classList.add("invalid"); errors.push(f.name); continue; }
        text = s;
      }
      parts.push(`${JSON.stringify(f.name)}:${text}`);
    }
    return { text: errors.length ? null : "{" + parts.join(",") + "}", errors };
  }

  toolSel.onchange = renderToolForm;
  editJson.onclick = () => {
    const { text } = formArgs();
    rawMode = true; argsText.value = text || "{}";
    argsText.classList.remove("hidden"); formBox.classList.add("hidden"); editJson.disabled = true;
  };

  function toolFacts(ev) {
    const facts = [];
    if (ev.cancel_status) {
      facts.push("AgentWiz stopped waiting for the tool.");
      const what = { stream_closed: "The connection was closed, which MCP 2026-07-28 defines as cancellation.",
        delivered: "The server acknowledged the cancellation notice.", failed: "The cancellation notice could not be delivered.",
        not_sent: "No cancellation was sent.", unconfirmed: "A cancellation notice was sent; its delivery is not yet confirmed." };
      facts.push(what[ev.cancel_status] || ev.cancel_status);
      if (ev.outcome === "unknown") facts.push("The call may have been sent, so whether the tool actually stopped is unknown.");
    }
    return facts;
  }

  function renderToolFinal(ev) {
    resultBox.replaceChildren();
    const labels = { ok: "OK", tool_error: "Tool error (the tool ran and reported a failure)",
      rejected: "Rejected (the call did not run)", unknown: "Unknown (the call may have run; it is not resent)" };
    resultBox.append(h("div", { class: ev.outcome === "ok" ? "" : "warn-text", text: `${labels[ev.outcome] || ev.outcome} · MCP ${ev.era || "?"} ${ev.protocol_version || ""}` }));
    for (const f of toolFacts(ev)) resultBox.append(h("div", { class: "note", text: f }));
    if (ev.result) {
      if (ev.result.text !== "") {
        const p = outPanel("mcp", "result-text", "Text");
        p.pre.textContent = ev.result.text; resultBox.append(p.el);
      }
      if (ev.result.structured_text !== null) {
        const p = outPanel("mcp", "result-structured", "Structured content (as sent)");
        p.pre.textContent = ev.result.structured_text; resultBox.append(p.el);
      }
      if (ev.result.other_items.length)
        resultBox.append(h("div", { class: "note", text: "Other items: " + ev.result.other_items.map((i) => i.type).join(", ") }));
    } else {
      resultBox.append(h("div", { class: "warn-text", text: ev.description || ev.reason || "" }));
      if (ev.server_text) resultBox.append(h("pre", { text: "the server says: " + ev.server_text }));
    }
    textPreview.hide(); structuredPreview.hide();
    if ((ev.outcome === "ok" || ev.outcome === "tool_error") && ev.insertion) {
      const pnotes = [];
      if (ev.result.other_items.length) pnotes.push(`${ev.result.other_items.length} other content items are not copied.`);
      textPreview.show({ title: `Result of ${ev.server}.${ev.tool} (${ev.outcome})`, insertion: ev.insertion, notes: pnotes });
      if (ev.insertion_structured)
        structuredPreview.show({ title: `Structured content of ${ev.server}.${ev.tool}`, insertion: ev.insertion_structured, notes: [] });
    }
  }

  async function run() {
    if (toolCtl) return;
    const tool = selectedTool(), server = serverSel.value;
    if (!tool) { say("idle", "Load tools and choose one first."); return; }
    let text;
    if (rawMode) {
      text = argsText.value;
      try { JSON.parse(text); } catch (e) { say("idle", "The arguments are not valid JSON: " + e.message); return; }
    } else {
      const built = formArgs();
      if (built.text === null) { say("idle", "Correct the marked fields: " + built.errors.join(", ")); return; }
      text = built.text;
    }
    const payload = JSON.stringify({ server, tool: tool.name, arguments_text: text, revision: mcpInfo().revision });
    if (state.limits && new TextEncoder().encode(payload).length > state.limits.request_bytes) {
      say("idle", "The arguments are larger than a request may be."); return;
    }
    toolCtl = new AbortController(); toolOpId = null;
    runBtn.disabled = true; stopBtn.disabled = false;
    resultBox.replaceChildren(); textPreview.hide(); structuredPreview.hide();
    say("running", "Running…");
    setTabRunning("mcp-tools", true);
    let final = false, outcome = null;
    try {
      const r = await fetch("/api/mcp/call", { method: "POST", signal: toolCtl.signal,
        headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" }, body: payload });
      if (!r.ok) {
        let j = {}; try { j = await r.json(); } catch (e) { /* keep */ }
        if (r.status === 409 && j.code === "stale_revision") { await reloadAfterStale(); say("stale", SERVER_STALE); }
        else { if (r.status === 409) await reloadAfterStale(); say("idle", j.error || `${r.status} ${r.statusText}`); }
        final = true;                      // answered: nothing is left to report
        return;
      }
      await readLines(r, (ev) => {
        if (ev.type === "started") toolOpId = ev.operation_id;
        else if (ev.type === "progress") status.textContent = `Progress ${ev.progress}${ev.total !== null ? " of " + ev.total : ""}${ev.message ? " · " + ev.message : ""}`;
        else if (ev.type === "final") { final = true; outcome = ev.outcome; renderToolFinal(ev); return "stop"; }
      });
      if (final) say("done", "", outcome);
    } catch (e) { /* reported below */ }
    finally {
      if (!final) say("done", "Connection ended before a final result was received; the tool may or may not have run.", "unknown");
      toolCtl = null; runBtn.disabled = false; stopBtn.disabled = true;
      setTabRunning("mcp-tools", false);
    }
  }
  runBtn.onclick = run;

  stopBtn.onclick = async () => {
    if (!toolOpId) return;
    status.textContent = "Stopping…";
    try {
      const res = await api("/api/mcp/cancel", { operation_id: toolOpId });
      const facts = toolFacts({ cancel_status: res.status, outcome: "unknown" });
      status.textContent = facts.join(" ") + (res.reason ? ` (${res.reason})` : "");
    } catch (e) { status.textContent = e.message; }
  };

  TABS["mcp-tools"] = { onState: renderMcp, submit: run,
    async tutorialPrepare(server, tool) {
      if (toolCtl) throw new Error("Stop the running tool first.");
      serverSel.value = server;
      await loadBtn.onclick();
      toolSel.value = tool; renderToolForm();
      if (tool === "echo") {
        editJson.click(); argsText.value = '{"text":"Hello from the tutorial","times":2}';
      }
    },
  };
})();

// --- the MCP servers dialog (a header dialog since 0.1.3) --------------------------------------------------------
function serverRow(name, s) {
  const ro = mcpInfo().read_only;
  const row = h("fieldset", { class: "server-row" });
  const fields = h("div", { class: "fields" });
  const add = (label, key, value, ph) => {
    const input = h("input", { "data-key": key, placeholder: ph });
    input.value = value === null || value === undefined ? "" : String(value);
    input.disabled = ro;
    fields.append(h("div", {}, h("label", { text: label }), input));
    return input;
  };
  add("Name", "name", name);
  add("URL", "url", s.url || "", "http://127.0.0.1:8765/mcp");
  for (const [k, label] of LIMIT_FIELDS) add(label, k, s[k] ?? { idle_timeout_s: 30, call_deadline_s: 120, discovery_deadline_s: 20 }[k]);
  add("Token variable (optional)", "token_env", s.token_env || "", "MY_SERVER_TOKEN");
  const tok = add(`Token (write-only; ${s.token_source || "none"})`, "token", "");
  tok.type = "password"; tok.autocomplete = "off";
  const actions = h("div", { class: "row" });
  const clear = h("button", { type: "button", text: "Clear token", disabled: ro || !name });
  clear.onclick = async () => {
    try {
      state = await api("/api/mcp/token", { server: name, token: "", revision: mcpInfo().revision });
      renderState(); fillServers(); $("servers-msg").textContent = "Token cleared.";
    } catch (e) { await serversFailure(e); }
  };
  const del = h("button", { type: "button", text: "Delete", disabled: ro });
  del.onclick = () => row.remove();
  actions.append(clear, del);
  row.append(fields, actions);
  return row;
}

function fillServers() {
  const list = $("servers-list"); list.replaceChildren();
  for (const [name, s] of Object.entries(mcpInfo().servers)) list.append(serverRow(name, s));
  const ro = mcpInfo().read_only;
  $("add-server").disabled = ro; $("save-servers").disabled = ro;
  $("servers-msg").textContent = ro ? "The MCP server library is read-only: " + (mcpInfo().problems || []).map((p) => p.message).join("; ") : "";
}

async function serversFailure(e) {
  try { await refreshState(); } catch (e2) { /* keep */ }
  if (e.code === "stale_revision") { fillServers(); $("servers-msg").textContent = SERVER_STALE; }
  else $("servers-msg").textContent = e.message;
}

$("open-servers").onclick = () => { fillServers(); $("servers-dialog").showModal(); };
$("close-servers").onclick = () => $("servers-dialog").close();
$("add-server").onclick = () => $("servers-list").append(serverRow("", {}));
$("save-servers").onclick = async () => {
  const servers = {}, tokens = [];
  for (const row of $("servers-list").querySelectorAll(".server-row")) {
    const get = (k) => row.querySelector(`[data-key="${k}"]`).value.trim();
    const name = get("name");
    if (!NAME_RE.test(name)) { $("servers-msg").textContent = "Each server needs a name: 1 to 64 letters, digits, '.', '_' or '-'."; return; }
    const entry = { url: get("url"), token_env: get("token_env") || null };
    for (const [k] of LIMIT_FIELDS) {
      const v = get(k);
      if (!INTEGER_RE.test(v)) { $("servers-msg").textContent = `${name}: ${k} must be a whole number.`; return; }
      entry[k] = Number(v);
    }
    servers[name] = entry;
    const token = row.querySelector('[data-key="token"]').value;
    if (token) tokens.push([name, token]);
  }
  try {
    state = await api("/api/mcp/servers", { servers, revision: mcpInfo().revision });
    for (const [name, token] of tokens) state = await api("/api/mcp/token", { server: name, token, revision: mcpInfo().revision });
    renderState(); fillServers(); $("servers-msg").textContent = "Saved.";
  } catch (e) { await serversFailure(e); }
};

// --- Contracts (Section 11.2; contracts are saved in the workspace, Section 7.8) --------------------------------------
(function contractsTab() {
  const panel = $("panel-contracts");
  const TEMPLATES = {
    text: { format: "text", description: "", checks: [{ type: "contains", value: "TEXT THE ANSWER MUST CONTAIN" }] },
    json: { format: "json", strict: false, description: "", schema: null, checks: [] },
  };
  let current = null;                 // {name, revision, problem} of the opened contract; null for a new one
  let arming = false;
  const listEl = h("ul", { class: "list", "data-test": "contracts-list" });
  const schemaStatus = h("div", { class: "note", "data-test": "contracts-schema-status" });
  const nameInput = h("input", { id: "contracts-name", "data-test": "contracts-name", placeholder: "contract name" });
  const editor = h("textarea", { class: "editor", spellcheck: "false", "data-test": "contracts-editor", "data-state": "idle" });
  const newText = h("button", { type: "button", "data-test": "contracts-new-text", text: "New text contract" });
  const newJson = h("button", { type: "button", "data-test": "contracts-new-json", text: "New JSON contract" });
  const saveBtn = h("button", { class: "primary", type: "button", "data-test": "contracts-save", text: "Save" });
  const deleteBtn = h("button", { type: "button", "data-test": "contracts-delete", text: "Delete" });
  const confirmBtn = h("button", { type: "button", class: "hidden", "data-test": "contracts-delete-confirm", text: "Confirm: delete this contract" });
  const cancelBtn = h("button", { type: "button", class: "hidden", "data-test": "contracts-delete-cancel", text: "Cancel" });
  const msg = h("div", { class: "note", "data-test": "contracts-msg" });
  const errorsEl = h("ul", { class: "err-text", "data-test": "contracts-errors" });
  const checkText_ = h("textarea", { rows: 5, "data-test": "contracts-check-text", placeholder: "Paste text to check against the contract above" });
  const checkBtn = h("button", { type: "button", "data-test": "contracts-run-check", text: "Check" });
  const result = checkBox("contracts");
  panel.append(h("p", { class: "panel-intro", text: "Contracts: define, save and delete contracts, and check pasted text against one. No model is involved." }),
    schemaStatus,
    h("label", { text: "Saved contracts" }), listEl,
    h("div", { class: "row" }, newText, newJson),
    h("label", { for: "contracts-name", text: "Name" }), nameInput,
    h("label", { text: "Contract (JSON text)" }), editor,
    h("div", { class: "row" }, saveBtn, deleteBtn, confirmBtn, cancelBtn, copyControl("contracts-copy-editor", () => editor.value, () => editor)),
    msg, errorsEl,
    h("label", { text: "Check text" }), checkText_,
    h("div", { class: "row" }, checkBtn), result.el);

  const items = () => (state.contracts && state.contracts.items) || [];
  const readOnly = () => !!(state.contracts && state.contracts.read_only);
  const setEditor = (s) => { editor.dataset.state = s; };

  function refreshButtons() {
    const damaged = !!(current && current.problem);
    saveBtn.disabled = readOnly() || damaged;
    deleteBtn.disabled = readOnly() || !current || arming;
    deleteBtn.classList.toggle("hidden", arming);
    confirmBtn.classList.toggle("hidden", !arming); cancelBtn.classList.toggle("hidden", !arming);
    nameInput.readOnly = !!current;
  }

  function renderList() {
    listEl.replaceChildren();
    if (!items().length) listEl.append(h("li", { class: "muted", text: "No saved contracts yet." }));
    for (const c of items()) {
      const li = h("li", { class: "pick" + (current && current.name === c.name ? " current" : ""), "data-test": "contracts-row",
        "data-name": c.name, "data-revision": String(c.revision) },
        `${c.name} · ${c.format || "?"} · revision ${c.revision}${c.description ? " · " + c.description : ""}${c.problem ? " · PROBLEM: " + c.problem.message : ""}`);
      li.onclick = () => open(c.name);
      listEl.append(li);
    }
  }

  function renderSchemaStatus() {
    const c = (state.contracts && state.contracts.checks) || { available: false, detail: "unknown" };
    schemaStatus.dataset.available = c.available ? "true" : "false";
    schemaStatus.textContent = c.available ? `JSON Schema checks: available (${c.detail})`
      : `JSON Schema checks: not available (${c.detail}). Install them with: pip install 'AgentWiz[checks]'`;
  }

  function showIssues(body) {
    errorsEl.replaceChildren();
    for (const i of body.issues || []) errorsEl.append(h("li", { text: `${i.location}: ${i.message}` }));
    const more = (body.issue_count || 0) - (body.issues || []).length;
    if (more > 0) errorsEl.append(h("li", { text: `… and ${more} more` }));
  }

  async function open(name) {
    arming = false;
    try {
      const c = await api("/api/contracts/" + encodeURIComponent(name));
      current = { name: c.name, revision: c.revision, problem: c.problem };
      nameInput.value = c.name; editor.value = c.text; setEditor("idle"); errorsEl.replaceChildren();
      msg.textContent = c.problem ? `This contract has a problem (${c.problem.message}). It cannot be saved over; repair the file with an editor.` : "";
    } catch (e) { msg.textContent = e.message; }
    renderList(); refreshButtons();
  }

  function fresh(kind) {
    arming = false; current = null;
    nameInput.value = ""; editor.value = JSON.stringify(TEMPLATES[kind], null, 2) + "\n";
    setEditor("idle"); msg.textContent = ""; errorsEl.replaceChildren();
    renderList(); refreshButtons();
  }

  newText.onclick = () => fresh("text");
  newJson.onclick = () => fresh("json");
  editor.addEventListener("input", () => setEditor("idle"));

  saveBtn.onclick = async () => {
    const name = nameInput.value.trim();
    errorsEl.replaceChildren();
    if (!NAME_RE.test(name)) {
      setEditor("error"); msg.textContent = "A contract name is 1 to 64 letters, digits, '.', '_' or '-', starting with a letter or digit."; return;
    }
    setTabRunning("contracts", true);
    try {
      const res = await api("/api/contracts/save", { name, text: editor.value, revision: current ? current.revision : null });
      state = res;
      current = { name: res.contract.name, revision: res.contract.revision, problem: res.contract.problem };
      editor.value = res.contract.text;
      msg.textContent = "Saved." + ((res.notes || []).length ? " " + res.notes.join(" ") : "");
      setEditor("saved"); renderState(); renderList(); refreshButtons();
    } catch (e) {
      setEditor("error");
      if (e.code === "contract_error") { msg.textContent = e.message; showIssues(e.body); }
      else if (e.code === "stale_revision") { await reloadAfterStale(); msg.textContent = "This contract changed elsewhere. Reopen it to load the current text; your edits are kept here."; }
      else { if (e.status === 409 || e.status === 404) await reloadAfterStale(); msg.textContent = e.message; }
    } finally { setTabRunning("contracts", false); }
  };

  deleteBtn.onclick = () => { arming = true; refreshButtons(); };
  cancelBtn.onclick = () => { arming = false; refreshButtons(); };
  confirmBtn.onclick = async () => {
    if (!current) return;
    arming = false;
    try {
      state = await api("/api/contracts/delete", { name: current.name, revision: current.revision });
      current = null; nameInput.value = ""; editor.value = ""; setEditor("idle"); errorsEl.replaceChildren();
      msg.textContent = "Deleted."; renderState();
    } catch (e) {
      if (e.status === 409 || e.status === 404) await reloadAfterStale();
      msg.textContent = e.code === "stale_revision" ? "This contract changed elsewhere; reopen it before deleting." : e.message;
    }
    renderList(); refreshButtons();
  };

  async function runCheck() {
    errorsEl.replaceChildren();
    setTabRunning("contracts", true);
    try {
      const r = await api("/api/contracts/check", { contract_text: editor.value, text: checkText_.value });
      result.show(r.check);
    } catch (e) {
      result.clear();
      if (e.code === "contract_error") { msg.textContent = e.message; showIssues(e.body); result.note("The contract is not valid, so nothing was checked."); }
      else msg.textContent = e.message;
    } finally { setTabRunning("contracts", false); }
  }
  checkBtn.onclick = runCheck;

  TABS.contracts = {
    async tutorialPrepare(text, checkText) {
      const existing = items().find((c) => c.name === "my-fields");
      if (existing) await open(existing.name);
      else { fresh("json"); nameInput.value = "my-fields"; }
      editor.value = text; checkText_.value = checkText;
      result.clear(); setEditor("idle");
    },
    submit: runCheck,
    onState() {
      renderSchemaStatus(); renderList();
      if (current) {                  // a file changed on disk since it was opened
        const now = items().find((c) => c.name === current.name);
        if (!now) msg.textContent = "This contract no longer exists. Saving creates it again only if you reopen a new one.";
        else if (now.revision !== current.revision) msg.textContent = "This contract changed on disk. Reopen it to load the current text; saving now will be refused as stale.";
      }
      refreshButtons();
    },
  };
  refreshButtons();
})();

// --- History (Section 10.5, 11.2) ---------------------------------------------------------------------------------------
(function historyTab() {
  const panel = $("panel-history");
  let openId = null, arming = false;
  const savingNote = h("div", { class: "note", "data-test": "history-saving" });
  const warning = h("div", { class: "warn-text", "data-test": "history-short-credential" });
  const refresh = h("button", { type: "button", "data-test": "history-refresh", text: "Refresh" });
  const count = h("span", { class: "note", "data-test": "history-count" });
  const listEl = h("ul", { class: "list", "data-test": "history-list" });
  const msg = h("div", { class: "note", "data-test": "history-msg" });
  const detail = h("div", { "data-test": "history-detail" });
  panel.append(h("p", { class: "panel-intro", text: "History: saved runs, read-only. Open one, copy any part, or delete it. A run is never loaded back into another tab." }),
    savingNote, warning, h("div", { class: "row" }, refresh, count), listEl, msg, detail);

  function sayList(text) { msg.textContent = text; }

  function messagesText(list) {
    return (list || []).map((m) => `[${m.role}]\n${m.content}`).join("\n\n");
  }

  function section(prefix, name, label, text, cls = "") {
    const p = outPanel(prefix, name, label, cls);
    p.pre.textContent = text;
    return p.el;
  }

  function renderRun(r) {
    detail.replaceChildren();
    arming = false;
    const run = r.run;
    const del = h("button", { type: "button", "data-test": "history-delete", text: "Delete this run" });
    const confirm_ = h("button", { type: "button", class: "hidden", "data-test": "history-delete-confirm", text: "Confirm: delete this run's folder" });
    const cancel_ = h("button", { type: "button", class: "hidden", "data-test": "history-delete-cancel", text: "Cancel" });
    const close = h("button", { type: "button", "data-test": "history-close", text: "Close" });
    del.onclick = () => { del.classList.add("hidden"); confirm_.classList.remove("hidden"); cancel_.classList.remove("hidden"); };
    cancel_.onclick = () => { del.classList.remove("hidden"); confirm_.classList.add("hidden"); cancel_.classList.add("hidden"); };
    close.onclick = () => { openId = null; detail.replaceChildren(); renderList(lastList); };
    confirm_.onclick = async () => {
      try {
        await api("/api/runs/delete", { run_id: openId });
        openId = null; detail.replaceChildren(); msg.textContent = "Deleted."; await load();
      } catch (e) { cancel_.onclick(); msg.textContent = e.message; if (e.code === "run_active") msg.dataset.code = e.code; }
    };
    detail.append(h("div", { class: "row" }, h("strong", { text: `Run ${openId}` }), del, confirm_, cancel_, close));
    detail.dataset.runId = openId;
    if (run) detail.append(section("history", "run", "run.json", JSON.stringify(run, null, 2), "exact"));
    for (const p of r.problems || []) detail.append(h("div", { class: "warn-text", text: `${p.file}: ${p.message}` }));
    if (r.result) detail.append(section("history", "result", "result.json", JSON.stringify(r.result, null, 2), "exact"));
    for (const a of r.attempts || []) {
      const res = a.result || a.partial || {};
      detail.append(h("fieldset", { "data-test": "history-attempt", "data-attempt-id": a.id },
        h("legend", { text: `Attempt ${a.attempt} · ${LABELS[a.outcome] || a.outcome} · check: ${a.check ? a.check.overall : (a.check_skipped ? "not checked" : "none")}` }),
        section("history", "messages", "Messages sent", messagesText(a.messages_sent)),
        section("history", "answer", "Answer", res.text || ""),
        section("history", "reasoning", "Reasoning", res.reasoning || "", "reasoning"),
        section("history", "check", "Check result", a.check ? checkText(a.check) : (a.check_skipped ? (SKIPPED[a.check_skipped] || "Not checked.") : "No contract.")),
        section("history", "record", "Full record", JSON.stringify(a, null, 2), "exact")));
    }
  }

  let lastList = null;
  function renderList(r) {
    lastList = r;
    listEl.replaceChildren();
    if (!r) return;
    count.textContent = `${r.shown} of ${r.total} shown`;
    count.dataset.shown = String(r.shown); count.dataset.total = String(r.total);
    if (!r.runs.length) listEl.append(h("li", { class: "muted", text: "No saved runs." }));
    for (const row of r.runs) {
      const li = h("li", { class: "pick" + (row.run_id === openId ? " current" : ""), "data-test": "history-row", "data-run-id": row.run_id },
        `${row.created_at || row.folder} · ${row.source || "?"}${row.block ? " " + row.block : ""} · ${row.attempts} ${row.attempts === 1 ? "attempt" : "attempts"} · ${row.outcome ? (LABELS[row.outcome] || row.outcome) : "no attempt saved"} · check: ${row.check || "none"}${row.problem ? " · PROBLEM: " + row.problem.message : ""}`);
      li.onclick = () => openRun(row.run_id);
      listEl.append(li);
    }
  }

  async function load() {
    setTabRunning("history", true);
    try { renderList(await api("/api/runs")); }
    catch (e) { sayList(e.message); }
    finally { setTabRunning("history", false); }
  }

  async function openRun(id) {
    openId = id;
    try { renderRun(await api("/api/runs/" + id)); msg.textContent = ""; }
    catch (e) { openId = null; detail.replaceChildren(); msg.textContent = e.message; if (e.code === "no_such_run") await load(); }
    renderList(lastList);
  }

  refresh.onclick = load;
  TABS.history = {
    onShow() { msg.textContent = ""; load(); },
    onState() {
      const hi = historyInfo();
      savingNote.textContent = (hi.save_runs ? "Saving runs is on. " : "Saving runs is off; turn it on in the header. ") + DISCLOSURE;
      warning.textContent = shortCredentialWarning();
    },
  };
})();

// --- Blocks (techspec 0.1.4, Section 13.1) -------------------------------------------------------------------------
// Runs one saved single-step block. Input values travel as text; the server describes the forms, so a schema's
// numbers never pass through this page's JavaScript (P14).
const BLOCK_STALE = "The block changed (its files or a contract it names). It has been reloaded; your input texts were kept where the input still exists. Check them and run again.";
const BLOCK_OUTCOMES = { complete: "Complete", rejected: "Rejected before any work", failed: "Failed", stopped: "Stopped",
  budget_exceeded: "Budget exceeded", unknown: "Unknown (a tool call may have run)" };

(function blocksTab() {
  const panel = $("panel-blocks");
  let listing = null, detail = null, selected = null, loadingDetail = 0, selecting = 0;
  let runCtl = null, runId = null, pendingStop = false, polling = false, finalSeen = false, stopRequested = false;
  let rows = [];                                   // the trace's attempts: {id, attempt, outcome, check, repair_reason}
  const inputs = new Map();                         // input name -> {get(): text|null, set(text), el}

  const listEl = h("ul", { class: "list", "data-test": "blocks-list" });
  const countEl = h("span", { class: "note", "data-test": "blocks-count" });
  const pathEl = h("span", { class: "note", "data-test": "blocks-path" });
  const reload = h("button", { type: "button", "data-test": "blocks-reload", text: "Reload" });
  const activeEl = h("div", { class: "note", "data-test": "blocks-active" });
  const defEl = h("div", { "data-test": "blocks-definition" });
  const formEl = h("div", { class: "fields", "data-test": "blocks-form" });
  const runBtn = h("button", { class: "primary", type: "button", disabled: true, "data-test": "blocks-run", text: "Run" });
  const stopBtn = h("button", { type: "button", disabled: true, "data-test": "blocks-stop", text: "Stop" });
  const status = h("span", { class: "note", "data-test": "blocks-status", "data-state": "idle" });
  const noteEl = h("div", { class: "note", "data-test": "blocks-note" });
  const traceEl = h("div", { "data-test": "blocks-trace", "data-attempts": "0", "data-truncated": "0" });
  const attemptsEl = h("ul", { class: "list", "data-test": "blocks-attempts" });
  const usageEl = h("div", { class: "note", "data-test": "blocks-usage" });
  const stepEl = h("div", { class: "note", "data-test": "blocks-step" });
  const detailsEl = h("div", { "data-test": "blocks-details" });
  const outputsEl = h("div", { "data-test": "blocks-outputs" });
  panel.append(h("p", { class: "panel-intro", text: "Blocks: run a saved single-step block (a model, tool or script step) from the workspace's blocks folder, and see exactly what it did." }),
    h("div", { class: "row" }, reload, countEl), pathEl, listEl, activeEl, defEl,
    h("h4", { text: "Inputs" }), formEl,
    h("div", { class: "row" }, runBtn, stopBtn, status), noteEl, traceEl, outputsEl, detailsEl);
  traceEl.append(stepEl, attemptsEl, usageEl);

  const say = (state_, text, outcome, save) => {
    status.dataset.state = state_; status.textContent = text || "";
    if (outcome) status.dataset.outcome = outcome; else delete status.dataset.outcome;
    if (save) status.dataset.save = save; else if (state_ !== "done") delete status.dataset.save;
    if (runId) status.dataset.runId = runId; else delete status.dataset.runId;
  };
  const busy = () => !!runCtl || polling;
  const usable = () => !!detail && !detail.problem && selected === detail.name;

  function controls() {
    runBtn.disabled = busy() || !usable();
    stopBtn.disabled = !busy() || finalSeen || stopRequested && !runId;
    setTabRunning("blocks", busy());
  }

  // --- the list ---------------------------------------------------------------------------------------------
  function problemText(p) { return p ? `${p.file}: ${p.code}${p.issues && p.issues.length ? " · " + p.issues[0].location + ": " + p.issues[0].message : ""}` : ""; }

  function renderList() {
    listEl.replaceChildren();
    if (!listing) return;
    countEl.textContent = listing.total > listing.shown ? `${listing.shown} of ${listing.total} shown` : `${listing.total} ${listing.total === 1 ? "block" : "blocks"}`;
    countEl.dataset.shown = String(listing.shown); countEl.dataset.total = String(listing.total);
    pathEl.textContent = "Blocks folder: " + (listing.path || "");
    if (!listing.blocks.length) listEl.append(h("li", { class: "muted", text: "No blocks. Put a block folder (block.json and its files) in the folder above, then Reload." }));
    for (const b of listing.blocks) {
      const li = h("li", { class: "pick" + (b.name === selected ? " current" : ""), "data-test": "blocks-row", "data-block": b.name,
        "data-problem": b.problem ? b.problem.code : "",
        text: b.problem ? `${b.name} · PROBLEM: ${problemText(b.problem)}`
          : `${b.name} · ${b.kind || "?"} step · revision ${b.revision}${b.description ? " · " + b.description : ""}` });
      li.onclick = () => select(b.name);
      listEl.append(li);
    }
    renderActive();
  }

  function renderActive() {
    activeEl.replaceChildren();
    const runs = (listing && listing.active_runs) || [];
    activeEl.dataset.count = String(runs.length);
    if (!runs.length) return;
    activeEl.append(h("div", { text: "Block runs still running:" }));
    for (const r of runs) {
      const attach = h("button", { type: "button", "data-test": "blocks-reattach", text: "Follow", disabled: busy() });
      attach.onclick = () => follow(r.run_id, r.block);
      const stop = h("button", { type: "button", "data-test": "blocks-active-stop", text: "Stop" });
      stop.onclick = async () => {
        try { await api("/api/blocks/stop", { run_id: r.run_id }); noteEl.textContent = `Stopping run ${r.run_id}…`; }
        catch (e) { noteEl.textContent = e.message; }
      };
      activeEl.append(h("div", { class: "row", "data-test": "blocks-active-run", "data-run-id": r.run_id },
        `${r.block || "?"} · ${r.run_id} · started ${r.started_at}`, attach, stop));
    }
  }

  async function loadListing(forceReload) {
    try {
      listing = await api("/api/blocks" + (forceReload ? "?reload=1" : ""));
      renderList();
      if (selected && !listing.blocks.some((b) => b.name === selected)) { selected = null; detail = null; defEl.replaceChildren(); formEl.replaceChildren(); inputs.clear(); }
      controls();
    } catch (e) { noteEl.textContent = e.message; }
  }

  // --- the definition and the inputs ----------------------------------------------------------------------------
  function fileBlock(f) {
    const pre = h("pre", { class: "exact", text: f.text === null ? `(unavailable: ${f.unavailable})` : f.text });
    return h("div", { "data-test": "blocks-file", "data-path": f.path },
      h("div", { class: "panelhead" }, h("label", { text: `${f.path}${f.sha256 ? " · sha256 " + f.sha256 : ""}` }),
        f.text === null ? null : copyControl("blocks-copy-file", () => f.text, () => pre)), pre);
  }

  function renderDefinition() {
    defEl.replaceChildren();
    if (!detail) return;
    defEl.append(h("h4", { text: `${detail.name} · revision ${detail.revision}${detail.description ? " · " + detail.description : ""}` }));
    if (detail.problem) {
      defEl.append(h("div", { class: "warn-text", "data-test": "blocks-problem", text: "This block cannot be run: " + problemText(detail.problem) }));
      const list = h("ul", { "data-test": "blocks-problem-issues" });
      for (const i of detail.problem.issues || []) list.append(h("li", { text: `${i.location}: ${i.message}` }));
      if (detail.problem.total > (detail.problem.issues || []).length) list.append(h("li", { class: "muted", text: `… and ${detail.problem.total - detail.problem.issues.length} more` }));
      defEl.append(list);
    }
    if (detail.step) defEl.append(h("div", { class: "note", "data-test": "blocks-step-def" },
      `Step ${detail.step.id}: ${detail.step.kind}` + (detail.step.role ? ` · role ${detail.step.role}` : "") +
      (detail.step.server ? ` · ${detail.step.server}.${detail.step.tool}` : "") + (detail.step.file ? ` · script ${detail.step.file}` : "")));
    if (detail.budget) defEl.append(h("div", { class: "note", "data-test": "blocks-budget",
      text: `Budget: ${detail.budget.max_seconds} s` + (detail.budget.max_model_tokens === null ? "" : `, about ${detail.budget.max_model_tokens} model tokens (a soft allowance)`) }));
    for (const n of detail.notes || []) defEl.append(h("div", { class: "note", text: n }));
    const files = h("details", { open: true }, h("summary", { text: "Files (exact text)" }));
    for (const f of detail.files) files.append(fileBlock(f));
    defEl.append(files);
    const contractsBox = h("details", {}, h("summary", { text: "Contracts (exact text)" }));
    for (const section of ["inputs", "outputs"])
      for (const [name, c] of Object.entries(detail.contracts[section] || {})) {
        const pre = h("pre", { class: "exact", text: c.text });
        contractsBox.append(h("div", { "data-test": "blocks-contract", "data-section": section, "data-name": name },
          h("div", { class: "panelhead" }, h("label", { text: `${section === "inputs" ? "input" : "output"} ${name} · ${c.name ? "saved contract " + c.name + " revision " + c.revision : "inline"}` }),
            copyControl("blocks-copy-contract", () => c.text, () => pre)), pre));
      }
    defEl.append(contractsBox);
  }

  function textControl(d, raw) {
    const el = h("textarea", { rows: 4, spellcheck: "false", "data-test": "blocks-input", "data-input": d.name, "data-mode": "raw" });
    return { el, get: () => el.value, set: (t) => { el.value = t; } };
  }

  function formControl(d) {
    const box = h("div", { class: "fields", "data-test": "blocks-input", "data-input": d.name, "data-mode": "form" });
    const raw = h("textarea", { rows: 5, spellcheck: "false", class: "hidden", "data-test": "blocks-input-raw", "data-input": d.name });
    const edit = h("button", { type: "button", "data-test": "blocks-edit-json", "data-input": d.name, text: "Edit as JSON" });
    const wrap = h("div", {}, box, raw, edit);
    let rawMode = false;
    for (const f of d.form.fields) {
      let input;
      if (f.enum || f.type === "boolean") {
        input = document.createElement("select");
        if (!f.required) input.add(new Option("(unset)", ""));
        const values = f.enum || ["true", "false"];
        for (const v of values) input.add(new Option(v, v));
        if (f.default !== null && f.default !== undefined) input.value = String(f.default);
        else input.value = f.required ? values[0] : "";
      } else {
        input = document.createElement("input");
        if (f.default !== null && f.default !== undefined) input.value = String(f.default);
      }
      input.dataset.name = f.name;
      input.setAttribute("data-test", `blocks-field-${d.name}-${f.name}`);
      const cell = h("div", {}, h("label", { text: (f.title || f.name) + (f.required ? " *" : "") }), input);
      if (f.description) cell.append(h("span", { class: "note", text: f.description }));
      box.append(cell);
    }
    function build() {
      const parts = [], errors = [];
      for (const f of d.form.fields) {
        const input = box.querySelector(`[data-name="${CSS.escape(f.name)}"]`);
        input.classList.remove("invalid");
        const v = input.value;
        if (v === "" || (f.type !== "string" && v.trim() === "")) {
          if (f.required) { input.classList.add("invalid"); errors.push(f.name); }
          continue;
        }
        let text;
        if (f.type === "string") text = JSON.stringify(v);
        else if (f.type === "boolean") text = v === "true" ? "true" : "false";
        else {
          const s = v.trim();
          if (!(f.type === "integer" ? INTEGER_RE : NUMBER_RE).test(s)) { input.classList.add("invalid"); errors.push(f.name); continue; }
          text = s;                                // numbers stay exactly as typed
        }
        parts.push(`${JSON.stringify(f.name)}:${text}`);
      }
      return errors.length ? { errors } : { text: "{" + parts.join(",") + "}" };
    }
    const toRaw = (text) => { rawMode = true; raw.value = text; raw.classList.remove("hidden"); box.classList.add("hidden"); edit.disabled = true; box.dataset.mode = "raw"; };
    edit.onclick = () => { const b = build(); toRaw(b.text || "{}"); };
    return { el: wrap, get: () => { if (rawMode) return raw.value; const b = build(); return b.text === undefined ? null : b.text; },
      set: (t) => toRaw(t), errors: () => (rawMode ? [] : build().errors || []) };
  }

  function renderForm(keep = {}) {
    formEl.replaceChildren(); inputs.clear();
    if (!detail || !detail.inputs.length) { if (detail) formEl.append(h("div", { class: "muted", text: "This block has no inputs." })); return; }
    for (const d of detail.inputs) {
      const control = d.form ? formControl(d) : textControl(d);
      inputs.set(d.name, control);
      const cell = h("div", { "data-test": "blocks-input-cell", "data-input-cell": d.name },
        h("label", { text: `${d.name} (${d.format || "?"})${d.description ? " · " + d.description : ""}` }), control.el);
      for (const n of d.form_notes || []) cell.append(h("div", { class: "note", text: n }));
      formEl.append(cell);
      if (Object.prototype.hasOwnProperty.call(keep, d.name)) control.set(keep[d.name]);
    }
  }

  function currentTexts() {
    const out = {};
    for (const [name, c] of inputs) { const t = c.get(); if (t !== null) out[name] = t; }
    return out;
  }

  async function select(name, keep = {}) {
    selected = name;
    const ticket = ++loadingDetail;
    selecting++;
    try {
      const d = await api("/api/blocks/" + encodeURIComponent(name));
      if (ticket !== loadingDetail) return;
      detail = d;
      renderDefinition(); renderForm(keep); renderList();
    } catch (e) {
      if (ticket !== loadingDetail) return;
      detail = null; selected = null; defEl.replaceChildren(); formEl.replaceChildren(); inputs.clear();
      noteEl.textContent = e.message;
      await loadListing(false);
    } finally { selecting--; }
    controls();
  }

  // --- the trace --------------------------------------------------------------------------------------------------
  function clearRun() {
    rows = []; finalSeen = false; stopRequested = false; pendingStop = false;
    attemptsEl.replaceChildren(); usageEl.textContent = ""; stepEl.textContent = ""; noteEl.textContent = "";
    detailsEl.replaceChildren(); outputsEl.replaceChildren();
    traceEl.dataset.attempts = "0"; traceEl.dataset.truncated = "0";
  }

  function renderRows() {
    attemptsEl.replaceChildren();
    for (const r of rows) {
      const li = h("li", { "data-test": "blocks-attempt", "data-attempt": String(r.attempt), "data-check": r.check || "",
        "data-outcome": r.outcome || "", "data-repair-reason": r.repair_reason || "",
        text: `${r.attempt}. ${r.outcome ? (LABELS[r.outcome] || r.outcome) : "running"} · check: ${r.check || "not checked"}${r.repair_reason ? " · repair (" + r.repair_reason + ")" : ""}` });
      attemptsEl.append(li);
    }
    traceEl.dataset.attempts = String(rows.length);
  }

  function upsert(attempt, patch) {
    let row = rows.find((r) => r.attempt === attempt);
    if (!row) { row = { attempt }; rows.push(row); rows.sort((a, b) => a.attempt - b.attempt); }
    Object.assign(row, patch);
    renderRows();
  }

  function attemptNumber(id) { return Number(id.slice(id.lastIndexOf("-") + 1)); }

  function showOperation(kind, op, running) {
    for (const old of detailsEl.querySelectorAll('[data-test="blocks-operation"]')) old.remove();
    const text = op ? JSON.stringify(op, null, 2) : "";
    const box = h("div", { "data-test": "blocks-operation", "data-kind": kind, "data-outcome": op ? op.outcome : (running ? "running" : "") });
    if (op) {
      const p = outPanel("blocks", "operation-record", `${kind === "tool" ? "Tool call" : "Script"}: ${op.outcome}`);
      p.pre.textContent = text; box.append(p.el);
    } else box.append(h("div", { class: "note", text: kind === "tool" ? "Tool call running…" : "Script running…" }));
    detailsEl.append(box);
  }

  function usageText(u) {
    if (!u) return "";
    let t = `Reported usage: ${u.reported_tokens} tokens`;
    if (u.limit !== null && u.limit !== undefined) t += ` of a soft allowance of ${u.limit}`;
    if (u.over_by) t += ` (over by ${u.over_by})`;
    if (u.unreported_attempts && u.unreported_attempts.length) t += `; no usage reported for attempt${u.unreported_attempts.length === 1 ? "" : "s"} ${u.unreported_attempts.join(", ")}`;
    return t;
  }

  function renderFinal(result, saveStatus) {
    finalSeen = true;
    const step = (result.steps || [])[0] || null;
    if (step) {
      stepEl.textContent = `Step ${step.step_id}: ${step.kind}` + (step.role ? ` · role ${step.role} (profile ${step.profile || "?"}, model ${step.model || "?"})` : "")
        + ` · ${step.outcome}${step.failure ? " (" + step.failure + ")" : ""}`;
      if (step.kind === "model") {
        const known = new Set(rows.map((r) => r.attempt));
        for (const id of step.attempts || []) if (!known.has(attemptNumber(id))) rows.push({ attempt: attemptNumber(id) });
        rows.sort((a, b) => a.attempt - b.attempt);
        renderRows();
        traceEl.dataset.truncated = String(step.truncated_attempts || 0);
        if (step.truncated_attempts) stepEl.textContent += ` · ${step.truncated_attempts} truncated (cap ${step.max_tokens === null ? "backend default" : step.max_tokens})`;
      }
      if (step.operation) showOperation(step.kind, step.operation, false);
      if (step.fills && step.fills.length) {
        const p = outPanel("blocks", "fills", "Fills (where each inserted value came from)");
        p.pre.textContent = JSON.stringify(step.fills, null, 2); detailsEl.append(p.el);
      }
    }
    usageEl.textContent = usageText(result.usage);
    const checks = Object.entries(result.input_checks || {}).map(([n, c]) => `input ${n}\n${checkText(c)}`)
      .concat(Object.entries((step && step.output_checks) || {}).map(([n, c]) => `output ${n}\n${checkText(c)}`));
    if (checks.length) { const p = outPanel("blocks", "checks", "Check results"); p.pre.textContent = checks.join("\n\n"); detailsEl.append(p.el); }
    if ((result.issues || []).length) {
      const p = outPanel("blocks", "issues", "Issues");
      p.pre.textContent = result.issues.map((i) => `${i.location}: ${i.message}`).join("\n"); detailsEl.append(p.el);
    }
    outputsEl.replaceChildren();
    for (const [name, out] of Object.entries(result.outputs || {})) {
      const pre = h("pre", { class: "exact", "data-test": "blocks-output", "data-output": name, text: out.text });
      const copy = copyControl("blocks-copy-output", () => out.text, () => pre);
      copy.querySelector("button").dataset.output = name;
      outputsEl.append(h("div", {}, h("div", { class: "panelhead" }, h("label", { text: `Output ${name} (${out.format})` }), copy), pre));
    }
    const full = outPanel("blocks", "result", "result.json");
    full.pre.textContent = JSON.stringify(result, null, 2); detailsEl.append(full.el);
    say("done", `${BLOCK_OUTCOMES[result.outcome] || result.outcome}`, result.outcome, saveStatus);
    if (saveStatus) status.dataset.save = saveStatus;
    controls();
  }

  // --- running ----------------------------------------------------------------------------------------------------
  function onEvent(ev) {
    if (ev.type === "started") {
      runId = ev.run_id; status.dataset.runId = runId;
      if (!stopRequested) say("running", `Running ${ev.block} (${ev.kind} step)…`);
      stepEl.textContent = `Step ${ev.step_id}: ${ev.kind}`;
      if (pendingStop) sendStop();
    } else if (ev.type === "attempt") {
      upsert(ev.attempt, { id: ev.attempt_id, outcome: ev.outcome, check: ev.check, repair_reason: ev.repair_reason });
    } else if (ev.type === "operation") {
      showOperation(ev.kind, null, true);
    } else if (ev.type === "final") {
      renderFinal(ev.result, ev.save_status);
    } else if (ev.type === "save") {
      status.dataset.save = ev.save_status;
    }
  }

  async function sendStop() {
    pendingStop = false;
    try { await api("/api/blocks/stop", { run_id: runId }); }
    catch (e) { noteEl.textContent = "Stop failed: " + e.message; }
  }

  function doStop() {
    if (!busy() || finalSeen) return;
    stopRequested = true;
    say("stopping", "Stopping…");
    if (runId === null) { pendingStop = true; controls(); return; }
    sendStop(); controls();
  }

  async function run() {
    if (busy() || !usable()) return;
    const texts = {};
    for (const [name, c] of inputs) {
      const t = c.get();
      if (t === null) { noteEl.textContent = `Correct the marked fields of ${name}.`; return; }
      texts[name] = t;
    }
    const payload = JSON.stringify({ name: detail.name, revision: detail.revision, inputs: texts });
    if (state.limits && new TextEncoder().encode(payload).length > state.limits.request_bytes) {
      noteEl.textContent = "The inputs are larger than a request may be."; return;
    }
    clearRun();
    runId = null;
    runCtl = new AbortController();
    say("running", "Starting…");
    controls();
    let outcomeSeen = false;
    try {
      const r = await fetch("/api/blocks/run", { method: "POST", signal: runCtl.signal,
        headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" }, body: payload });
      if (!r.ok) {
        let j = {}; try { j = await r.json(); } catch (e) { /* keep the status */ }
        outcomeSeen = true;
        if (r.status === 409 && j.code === "stale_revision") {
          const keep = currentTexts();
          await select(detail.name, keep);
          await loadListing(false);
          say("stale", BLOCK_STALE);
        } else {
          say("idle", j.error || `${r.status} ${r.statusText}`);
          if (r.status === 409) { await loadListing(true); if (selected) await select(selected, currentTexts()); }
        }
        return;
      }
      const how = await readLines(r, (ev) => { onEvent(ev); });
      outcomeSeen = finalSeen;
      if (!finalSeen && how !== "stopped") startPolling();
      else if (finalSeen && status.dataset.save === "pending") startPolling();
    } catch (e) {
      if (!finalSeen && runId) startPolling();
    } finally {
      runCtl = null;
      if (!finalSeen && !polling && !outcomeSeen && status.dataset.state !== "idle" && status.dataset.state !== "stale")
        say("done", "The connection ended before a final result was received.", "unknown");
      controls();
      loadListing(false);
    }
  }

  // --- polling and reattaching (10.9) ---------------------------------------------------------------------------
  function startPolling() {
    if (polling || runId === null) return;
    polling = true; controls();
    if (!finalSeen) say("polling", "Connection lost; asking AgentWiz for the outcome…");
    let failures = 0;
    const tick = async () => {
      if (!polling) return;
      let res;
      try { res = await apiText(`/api/block_runs/${runId}`); } catch (e) { res = null; }
      if (!res || (!res.ok && res.status !== 410)) {
        if (++failures >= 15) { polling = false; if (!finalSeen) say("done", "Outcome unknown: AgentWiz could not be reached.", "unknown"); controls(); return; }
      } else if (res.status === 410) {
        polling = false;
        if (!finalSeen) say("done", "This outcome is no longer held.", "unknown");
        controls(); return;
      } else if (res.json && res.json.state === "running") {
        failures = 0;
        for (const a of res.json.attempts || []) upsert(a.attempt, { id: a.id, outcome: a.outcome, check: a.check });
        if (res.json.stop_requested_at && status.dataset.state !== "stopping") say("stopping", "Stopping…");
        else if (status.dataset.state === "polling" || status.dataset.state === "idle") say("polling", "Run in progress; following it…");
      } else if (res.json && res.json.state === "ended") {
        failures = 0;
        if (!finalSeen) renderFinal(res.json.result, res.json.save_status);
        else if (res.json.save_status) status.dataset.save = res.json.save_status;
        if (res.json.save_status !== "pending") { polling = false; controls(); return; }
      }
      setTimeout(tick, POLL_MS);
    };
    tick();
  }

  function follow(id, blockName) {
    if (busy()) return;
    clearRun();
    runId = id;
    say("polling", `Following ${blockName || "block"} run ${id}…`);
    startPolling();
  }

  runBtn.onclick = run;
  stopBtn.onclick = doStop;
  reload.onclick = async () => {
    const keep = currentTexts();
    await loadListing(true);
    if (selected) await select(selected, keep);
  };

  TABS.blocks = {
    // Showing the tab never starts a second load of a block that is being loaded (a newer, keep-less load would
    // discard the texts the first one was asked to fill in).
    async onShow() { await loadListing(false); if (selected && !detail && !selecting) await select(selected); },
    onState() { controls(); },
    submit: run,
    // The tutorial: choose a block and fill its inputs.
    async tutorialPrepare(name, texts) {
      if (busy()) throw new Error("Stop the running block first.");
      await loadListing(true);
      await select(name, texts || {});
    },
  };
  controls();
})();

// --- the Roles dialog (techspec 0.1.4, Section 13.2) -------------------------------------------------------------
const ROLES_STALE = "The roles were saved elsewhere. The dialog now shows the saved roles; check them and save again.";
function rolesInfo() { return state.roles || { map: {}, revision: 0, read_only: true, path: "", problem: null, unresolved: [] }; }

function roleRow(name, profile) {
  const info = rolesInfo(), ro = info.read_only;
  const unresolved = (info.unresolved || []).find((u) => u.role === name);
  const row = h("fieldset", { class: "server-row", "data-test": "roles-row", "data-role": name, "data-unresolved": unresolved ? "true" : "" });
  const nameInput = h("input", { "data-key": "role", placeholder: "role name", value: name, disabled: ro });
  const select = h("select", { "data-key": "profile", disabled: ro });
  const names = profilesInfo().names || [];
  if (profile && !names.includes(profile)) select.add(new Option(`${profile} (missing)`, profile));
  for (const n of names) select.add(new Option(n, n));
  select.value = profile || (names[0] || "");
  const remove = h("button", { type: "button", "data-test": "roles-remove", text: "Remove", disabled: ro });
  remove.onclick = () => row.remove();
  row.append(h("div", { class: "fields" }, h("div", {}, h("label", { text: "Role" }), nameInput), h("div", {}, h("label", { text: "Profile" }), select)),
    h("div", { class: "row" }, remove));
  if (unresolved) row.append(h("div", { class: "warn-text", "data-test": "roles-reason", text: unresolved.reason }));
  return row;
}

function fillRoles(message) {
  const info = rolesInfo(), list = $("roles-list");
  list.replaceChildren();
  for (const [role, profile] of Object.entries(info.map || {})) list.append(roleRow(role, profile));
  $("roles-path").textContent = `File: ${info.path || ""} · revision ${info.revision}`;
  $("add-role").disabled = info.read_only; $("save-roles").disabled = info.read_only;
  const reason = info.read_only ? "Roles are read-only: " + (info.problem ? `${info.problem.file}: ${info.problem.message}` : "the workspace is read-only") : "";
  $("roles-msg").textContent = message || reason;
}

$("open-roles").onclick = () => { $("roles-dialog").dataset.state = "idle"; fillRoles(); $("roles-dialog").showModal(); };
$("close-roles").onclick = () => $("roles-dialog").close();
$("add-role").onclick = () => $("roles-list").append(roleRow("", ""));
$("save-roles").onclick = async () => {
  const map = {}, dlg = $("roles-dialog");
  for (const row of $("roles-list").querySelectorAll('[data-test="roles-row"]')) {
    const role = row.querySelector('[data-key="role"]').value.trim();
    const profile = row.querySelector('[data-key="profile"]').value;
    if (!NAME_RE.test(role)) { dlg.dataset.state = "error"; $("roles-msg").textContent = "Each role needs a name: 1 to 64 letters, digits, '.', '_' or '-'."; return; }
    if (Object.prototype.hasOwnProperty.call(map, role)) { dlg.dataset.state = "error"; $("roles-msg").textContent = `The role ${role} appears twice.`; return; }
    if (!profile) { dlg.dataset.state = "error"; $("roles-msg").textContent = `Choose a profile for ${role}.`; return; }
    map[role] = profile;
  }
  try {
    state = await api("/api/roles/save", { roles: map, revision: rolesInfo().revision });
    renderState(); fillRoles("Saved."); dlg.dataset.state = "saved";
  } catch (e) {
    try { await refreshState(); } catch (e2) { /* keep */ }
    if (e.code === "stale_revision") { fillRoles(ROLES_STALE); dlg.dataset.state = "stale"; }
    else { dlg.dataset.state = "error"; $("roles-msg").textContent = e.message; }
  }
};

// Tutorial is an explicit preparation layer, not a bridge between the tabs' working data. The topics, their order,
// tips, annotations and preparation come from the server's registry (tutorial_topics.py); this page keeps no list.
let tutorialInfo = null, tutorialTopic = null, tutorialBusy = false;
const tutorialTopics = () => (tutorialInfo && tutorialInfo.topics) || [];
const tutorialEl = (name) => document.querySelector(`[data-test="${name}"]`);
function tutorialStatus(text, state_ = "ready") {
  $("tutorial-status").textContent = text; $("tutorial-status").dataset.state = state_;
}
function tutorialAction(text, id, action) {
  const button = h("button", { type: "button", "data-test": "tutorial-action", "data-action": id, text });
  button.onclick = async () => { try { await action(); } catch (e) { tutorialStatus(e.message, "error"); } };
  $("tutorial-actions").append(button);
}
// The actions a topic may offer, by the IDs the registry uses.
const TUTORIAL_ACTIONS = {
  "example-document": () => TABS.documents.tutorialExample(),
  "show-role": async () => {
    $("open-roles").click();
    await new Promise((resolve) => { const d = $("roles-dialog"); const done = () => { d.removeEventListener("close", done); resolve(); }; d.addEventListener("close", done); });
  },
  "wait-script": async (topic) => { await TABS.blocks.tutorialPrepare("wait_for_stop", {}); tutorialTarget("blocks-run"); },
};
function tutorialTarget(name) {
  for (const el of document.querySelectorAll(".tutorial-target")) el.classList.remove("tutorial-target");
  if (name && tutorialEl(name)) tutorialEl(name).classList.add("tutorial-target");
}
async function tutorialPrepare(id) {
  if (tutorialBusy) return;
  tutorialBusy = true;
  tutorialStatus("Preparing example…", "loading");
  try {
    if (document.querySelector('[role="tab"][data-state="running"]')) throw new Error("Stop the running operation before changing steps.");
    const info = await api("/api/tutorial/step", { topic: id });
    if (info.busy) throw new Error("Stop the running request first.");
    tutorialInfo = info;
    for (const dialog of document.querySelectorAll("dialog[open]")) dialog.close();
    await refreshState();
    const topic = tutorialTopics().find((t) => t.id === id);
    tutorialTopic = id;
    selectTab(topic.tab);
    const box = $("tutorial-box");
    box.dataset.topic = topic.id; box.dataset.updatedIn = topic.updated_in;
    const position = tutorialTopics().findIndex((t) => t.id === id);
    $("tutorial-title").textContent = `Tutorial · ${position + 1}/${tutorialTopics().length} — ${topic.title} · ${topic.updated_in}`;
    $("tutorial-tip").textContent = topic.tip;
    $("tutorial-next").disabled = false;
    $("tutorial-back").disabled = position === 0;
    $("tutorial-jump").value = id;
    $("tutorial-actions").replaceChildren();
    tutorialTarget(null);
    const hook = topic.page.hook;
    if (hook) {
      const [tab, method] = hook.split(".");
      await TABS[tab][method](...topic.page.args);
    }
    for (const a of topic.page.actions || []) tutorialAction(a.label, a.id, () => TUTORIAL_ACTIONS[a.id](topic));
    tutorialTarget(topic.target);
    tutorialStatus("Example ready. Explore at your own pace; Next is available without completing any task.");
  } catch (e) { tutorialStatus(e.message, "error"); }
  finally { tutorialBusy = false; }
}
$("open-tutorial").onclick = async () => {
  $("tutorial-box").classList.remove("hidden");
  tutorialStatus("Preparing isolated tutorial…", "loading");
  try { const r = await api("/api/tutorial/start", {}); location.assign(r.url); }
  catch (e) { tutorialStatus(e.message, "error"); $("tutorial-box").classList.add("hidden"); }
};
const tutorialIndex = () => tutorialTopics().findIndex((t) => t.id === tutorialTopic);
$("tutorial-back").onclick = () => { const i = tutorialIndex(); if (i > 0) tutorialPrepare(tutorialTopics()[i - 1].id); };
$("tutorial-reset").onclick = () => tutorialPrepare(tutorialTopic);
$("tutorial-skip").onclick = () => tutorialAdvance();
$("tutorial-next").onclick = () => tutorialAdvance();
async function tutorialAdvance() {
  try {
    const i = tutorialIndex(), topics = tutorialTopics();
    if (i < topics.length - 1) return await tutorialPrepare(topics[i + 1].id);
    tutorialStatus("End of the learning examples. Revisit any topic or Exit to your normal workspace. This tutorial is not a release checklist.", "finished");
  } catch (e) { tutorialStatus(e.message, "error"); }
}
$("tutorial-exit").onclick = async () => {
  try { const r = await api("/api/tutorial/exit", {}); location.assign(r.url); }
  catch (e) { tutorialStatus(e.message, "error"); }
};
$("tutorial-jump").onchange = () => tutorialPrepare($("tutorial-jump").value);
function tutorialRouteOptions() {
  $("tutorial-jump").replaceChildren();
  for (const t of tutorialTopics()) $("tutorial-jump").add(new Option(`${t.title} · ${t.updated_in}`, t.id));
}
document.addEventListener("click", (event) => {
  if (!tutorialInfo || tutorialBusy || event.target.closest("#tutorial-box")) return;
  const button = event.target.closest("button");
  if (button) tutorialStatus(`Action received: ${button.textContent.trim()}. Explore the result; you can move to another topic whenever you like.`);
});
// Observe machine-readable states, not output wording, without claiming a visual pass.
const tutorialObserver = new MutationObserver((changes) => {
  if (!tutorialInfo || tutorialBusy) return;
  const change = changes.find((c) => !c.target.closest("#tutorial-box") &&
    c.target.matches('[data-test$="-status"], [data-test$="-check-result"]'));
  if (change) {
    const el = change.target;
    const value = el.dataset.outcome || el.dataset.state || el.dataset.check || "updated";
    const next = tutorialTopic === "repair" && el.dataset.state === "done" ?
      "Preview repair explains how to continue with a revised response." : "Explore the result or choose another feature.";
    tutorialStatus(`Detected: ${value}. ${next}`);
  }
});
tutorialObserver.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["data-state", "data-outcome", "data-check"] });
async function tutorialInit() {
  const info = await api("/api/tutorial");
  if (!info.active) return;
  tutorialInfo = info;
  $("open-tutorial").classList.add("hidden");
  $("tutorial-box").classList.remove("hidden");
  tutorialRouteOptions();
  await tutorialPrepare(info.topic);
  setInterval(() => api("/api/tutorial").catch(() => tutorialStatus("Tutorial disconnected. Return to the original AgentWiz page to start again.", "error")), 60000);
}

// --- start -----------------------------------------------------------------------------------------------------------------
selectTab(fragFromHash(), { hash: false });
refreshState().then(tutorialInit).catch((e) => {
  $("banner").replaceChildren(h("p", { text: e.message }));
  $("banner").classList.remove("hidden");
});
</script>
